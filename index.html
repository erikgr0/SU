<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Su's Space</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0D0D0F;
    --surface: #16161A;
    --surface2: #1E1E24;
    --border: rgba(255,255,255,0.07);
    --text: #F0EEE8;
    --muted: rgba(240,238,232,0.45);
    --glow: #ffffff;
    --accent: rgba(255,255,255,0.4);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Geist', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 0 1.25rem 4rem;
    overflow-x: hidden;
  }
  body::before {
    content: '';
    position: fixed;
    width: 500px; height: 500px;
    border-radius: 50%;
    top: -180px; left: 50%;
    transform: translateX(-50%);
    filter: blur(100px);
    opacity: 0.15;
    pointer-events: none;
    background: var(--glow);
    transition: background 0.9s ease;
    z-index: 0;
  }

  .top-nav {
    display: flex;
    justify-content: center;
    padding: 1.25rem 0 0;
    position: relative;
    z-index: 2;
    border-bottom: 1px solid var(--border);
    max-width: 780px;
    margin: 0 auto;
    gap: 0;
  }
  .nav-tab {
    padding: 0.65rem 0.75rem 0.6rem;
    cursor: pointer;
    font-size: 11px;
    color: var(--muted);
    border-bottom: 2px solid transparent;
    transition: color 0.2s, border-color 0.2s;
    white-space: nowrap;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    user-select: none;
    flex: 1;
  }
  .nav-tab .nav-icon { font-size: 1.2rem; line-height: 1; }
  .nav-tab:hover { color: var(--text); }
  .nav-tab.active { color: var(--text); border-bottom-color: var(--accent); }

  .page { display: none; max-width: 660px; margin: 0 auto; padding-top: 2.25rem; position: relative; z-index: 1; }
  .page.active { display: block; }

  .page-header { text-align: center; margin-bottom: 1.75rem; }
  .page-title { font-family: 'Instrument Serif', serif; font-size: clamp(1.5rem,4vw,2.2rem); font-weight: 400; line-height: 1.1; margin-bottom: 0.3rem; }
  .page-title em { font-style: italic; }
  .page-sub { font-size: 13px; color: var(--muted); }

  @keyframes spin { from{transform:rotate(0deg)} to{transform:rotate(360deg)} }
  .vinyl {
    width: 110px; height: 110px; border-radius: 50%;
    background: conic-gradient(#1c1c1c 0deg,#272727 40deg,#1c1c1c 80deg,#272727 120deg,#1c1c1c 160deg,#272727 200deg,#1c1c1c 240deg,#272727 280deg,#1c1c1c 320deg,#272727 360deg);
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 1.25rem; position: relative;
  }
  .vinyl.playing { animation: spin 5s linear infinite; }
  .vinyl-ring { position: absolute; border-radius: 50%; border: 1px solid rgba(255,255,255,0.05); }
  .vr1{width:65px;height:65px} .vr2{width:83px;height:83px} .vr3{width:100px;height:100px}
  .vinyl-center { width: 30px; height: 30px; border-radius: 50%; background: var(--bg); border: 1.5px solid rgba(255,255,255,0.1); z-index: 1; display:flex; align-items:center; justify-content:center; font-size:12px; }

  .play-wrap { display:flex; flex-direction:column; align-items:center; gap:0.75rem; margin-bottom:1.25rem; }
  .play-btn {
    width: 68px; height: 68px; border-radius: 50%;
    border: 1.5px solid var(--accent);
    background: rgba(255,255,255,0.04);
    cursor: pointer;
    display:flex; align-items:center; justify-content:center;
    transition: transform 0.2s, background 0.2s;
  }
  .play-btn:hover { transform: scale(1.08); background: rgba(255,255,255,0.09); }
  .play-btn svg { width: 22px; height: 22px; fill: var(--text); margin-left: 3px; }
  .play-hint { font-size: 12px; color: var(--muted); }

  .embed-wrap { border-radius: 12px; overflow: hidden; width: 100%; display: none; }
  .embed-wrap.visible { display: block; }
  .embed-wrap iframe { width: 100%; border: none; border-radius: 12px; display: block; }
  .open-full { display:block; text-align:center; margin-top:0.6rem; font-size:12px; color:var(--muted); text-decoration:none; transition:color 0.2s; }
  .open-full:hover { color: var(--text); }

  /* WORD CARD */
  .word-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 1.5rem;
    margin-top: 1.75rem;
    position: relative;
  }
  .word-loading {
    text-align: center;
    padding: 2rem 1rem;
    color: var(--muted);
    font-size: 13px;
  }
  .word-loading .dots span { animation: blink 1.4s infinite; display: inline-block; }
  .word-loading .dots span:nth-child(2) { animation-delay: 0.2s; }
  .word-loading .dots span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes blink { 0%,80%,100%{opacity:0.2} 40%{opacity:1} }

  .word-tag { font-size: 10px; letter-spacing:0.12em; color:var(--muted); text-transform:uppercase; margin-bottom:0.6rem; display:flex; align-items:center; gap:6px; }
  .word-tag::before { content:''; display:inline-block; width:6px; height:6px; border-radius:50%; background:var(--accent); }
  .word-es { font-family:'Instrument Serif',serif; font-size:2rem; font-style:italic; margin-bottom:0.15rem; }
  .word-type { font-size:11px; color:var(--muted); margin-bottom:0.4rem; }
  .word-nl-trans { font-size:1rem; font-weight:300; color:rgba(240,238,232,0.7); margin-bottom:0.85rem; }

  .pron-row { display:flex; align-items:center; gap:10px; margin-bottom:1rem; }
  .pron-text { font-size:13px; color:var(--muted); font-family:monospace; }
  .speak-btn {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 5px 12px;
    cursor: pointer;
    font-size: 12px;
    color: var(--muted);
    display: flex; align-items: center; gap: 5px;
    transition: border-color 0.2s, color 0.2s;
    font-family: 'Geist', sans-serif;
  }
  .speak-btn:hover { border-color: rgba(255,255,255,0.2); color: var(--text); }
  .speak-btn svg { width:13px; height:13px; fill:currentColor; }

  .word-uitleg { font-size: 13px; line-height: 1.7; color: rgba(240,238,232,0.75); margin-bottom: 1rem; }

  .examples-label { font-size:10px; letter-spacing:0.1em; text-transform:uppercase; color:var(--muted); margin-bottom:0.4rem; }
  .example-line { font-size:13px; color:rgba(240,238,232,0.6); margin-bottom:6px; line-height:1.55; }
  .example-line em { color:rgba(240,238,232,0.85); font-style:normal; }

  .rating-row { display:flex; gap:8px; margin-top:1.25rem; }
  .rate-btn {
    flex:1; background:var(--surface2); border:1px solid var(--border); border-radius:8px;
    padding:9px 6px; cursor:pointer; text-align:center; font-size:18px;
    transition: border-color 0.2s, background 0.2s;
  }
  .rate-btn span { display:block; font-size:10px; color:var(--muted); margin-top:3px; font-family:'Geist',sans-serif; }
  .rate-btn:hover { border-color:rgba(255,255,255,0.2); }
  .rate-btn.active-love { border-color:#FF6B9D; background:rgba(255,107,157,0.1); }
  .rate-btn.active-ok   { border-color:#6BCB77; background:rgba(107,203,119,0.1); }
  .rate-btn.active-nope { border-color:#8B9DC3; background:rgba(139,157,195,0.1); }

  .saved-msg { font-size:12px; color:var(--muted); text-align:center; margin-top:0.6rem; min-height:16px; }
  .saved-msg.ok { color:#6BCB77; }

  .refresh-word { background:none; border:none; cursor:pointer; color:var(--muted); font-size:11px; font-family:'Geist',sans-serif; position:absolute; top:1.25rem; right:1.25rem; display:flex; align-items:center; gap:4px; transition:color 0.2s; padding:4px 8px; border-radius:4px; }
  .refresh-word:hover { color:var(--text); }
  .refresh-word svg { width:12px; height:12px; fill:currentColor; transition:transform 0.4s; }
  .refresh-word.spinning svg { transform:rotate(360deg); }

  /* VOCAB PAGE */
  .folder-tabs { display:flex; gap:6px; margin-bottom:1.5rem; flex-wrap:wrap; }
  .folder-tab { padding:6px 14px; border:1px solid var(--border); border-radius:20px; font-size:12px; cursor:pointer; color:var(--muted); background:var(--surface); transition:all 0.15s; }
  .folder-tab:hover { color:var(--text); border-color:rgba(255,255,255,0.2); }
  .folder-tab.active { color:var(--text); border-color:rgba(255,255,255,0.4); }
  .folder-tab .cnt { font-size:10px; opacity:0.55; margin-left:3px; }

  .vocab-list { display:flex; flex-direction:column; gap:10px; }
  .vocab-item { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:1rem 1.25rem; cursor:pointer; transition:border-color 0.2s; }
  .vocab-item:hover { border-color:rgba(255,255,255,0.15); }
  .vi-header { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:3px; }
  .vi-word { font-family:'Instrument Serif',serif; font-size:1.2rem; font-style:italic; }
  .vi-rating { font-size:15px; }
  .vi-nl { font-size:12px; color:var(--muted); margin-bottom:0; }
  .vi-detail { display:none; margin-top:10px; padding-top:10px; border-top:1px solid var(--border); }
  .vi-detail.open { display:block; }
  .vi-uitleg { font-size:13px; line-height:1.65; color:rgba(240,238,232,0.75); margin-bottom:0.75rem; }
  .vi-pron-row { display:flex; align-items:center; gap:8px; margin-bottom:0.75rem; }
  .vi-pron { font-size:12px; color:var(--muted); font-family:monospace; }

  .empty-state { text-align:center; padding:3rem 1rem; color:var(--muted); font-size:14px; line-height:1.7; }
  .empty-state .big { font-size:2.5rem; margin-bottom:0.75rem; }

  @media(max-width:480px){
    .nav-tab{font-size:10px; padding:0.5rem 0.4rem;}
    .nav-icon{font-size:1rem !important;}
  }
</style>
</head>
<body>

<nav class="top-nav" id="topNav">
  <div class="nav-tab active" data-mood="0" onclick="switchMood(0)"><span class="nav-icon">🌤️</span>Cheer up</div>
  <div class="nav-tab" data-mood="1" onclick="switchMood(1)"><span class="nav-icon">🌧️</span>Melancholy</div>
  <div class="nav-tab" data-mood="2" onclick="switchMood(2)"><span class="nav-icon">🌿</span>Chill</div>
  <div class="nav-tab" data-mood="3" onclick="switchMood(3)"><span class="nav-icon">🤝</span>Us two</div>
  <div class="nav-tab" data-mood="4" onclick="switchMood(4)"><span class="nav-icon">✨</span>Su</div>
  <div class="nav-tab" data-page="vocab" onclick="switchPage('vocab')"><span class="nav-icon">📚</span>My words</div>
</nav>

<!-- MUSIC PAGE -->
<div class="page active" id="page-music">
  <div class="page-header">
    <h1 class="page-title">How are you <em>feeling?</em></h1>
    <p class="page-sub" id="moodDesc">For when you need a little push.</p>
  </div>
  <div class="vinyl" id="vinyl"><div class="vinyl-ring vr1"></div><div class="vinyl-ring vr2"></div><div class="vinyl-ring vr3"></div><div class="vinyl-center" id="vinylIcon">🌤️</div></div>
  <div class="play-wrap">
    <button class="play-btn" id="playBtn" onclick="playRandom()" aria-label="Play random song">
      <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
    </button>
    <span class="play-hint">Tap to play a random song</span>
  </div>
  <div class="embed-wrap" id="embedWrap"></div>
  <a class="open-full" id="openFull" href="#" target="_blank">Open full playlist in Spotify ↗</a>

  <!-- WORD CARD -->
  <div class="word-card" id="wordCard">
    <button class="refresh-word" id="refreshBtn" onclick="loadWord(true)" title="New word">
      <svg viewBox="0 0 24 24"><path d="M17.65 6.35A7.96 7.96 0 0 0 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08A5.99 5.99 0 0 1 12 18c-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
      New word
    </button>
    <div id="wordContent">
      <div class="word-loading">
        <div class="dots"><span>●</span><span>●</span><span>●</span></div>
        <div style="margin-top:0.5rem">Fetching a word…</div>
      </div>
    </div>
  </div>
</div>

<!-- VOCAB PAGE -->
<div class="page" id="page-vocab">
  <div class="page-header">
    <h1 class="page-title">My <em>words</em></h1>
    <p class="page-sub">Tap a word to read more — including pronunciation</p>
  </div>
  <div class="folder-tabs">
    <div class="folder-tab active" data-f="all"  onclick="filterFolder('all')">All <span class="cnt" id="cnt-all"></span></div>
    <div class="folder-tab" data-f="love" onclick="filterFolder('love')">❤️ Love it <span class="cnt" id="cnt-love"></span></div>
    <div class="folder-tab" data-f="ok"   onclick="filterFolder('ok')">👍 OK <span class="cnt" id="cnt-ok"></span></div>
    <div class="folder-tab" data-f="nope" onclick="filterFolder('nope')">👎 Not for me <span class="cnt" id="cnt-nope"></span></div>
  </div>
  <div class="vocab-list" id="vocabList"></div>
</div>

<script>
// ── CONFIG ────────────────────────────────────────────────────────────────────
const MOODS = [
  { id:0, label:'Cheer up',   icon:'🌤️', glow:'#FFD166', accent:'rgba(255,209,102,0.55)', desc:'For when you need a little push.',    playlist:'6o871dkZuW4YYdDnbr7Bal', link:'https://open.spotify.com/playlist/6o871dkZuW4YYdDnbr7Bal',
    prompt:'alegría, entusiasmo, energía positiva, motivación, celebración, optimismo' },
  { id:1, label:'Melancholy', icon:'🌧️', glow:'#8B9DC3', accent:'rgba(139,157,195,0.55)', desc:'Sometimes you just need to feel it.', playlist:'0u4EM2JCZEWQZMTzI7wwxw', link:'https://open.spotify.com/playlist/0u4EM2JCZEWQZMTzI7wwxw',
    prompt:'melancholie, nostalgie, stilte, gemis, vergankelijkheid, weemoed' },
  { id:2, label:'Chill',      icon:'🌿', glow:'#6BCB77', accent:'rgba(107,203,119,0.55)', desc:'Low effort. High vibe.',              playlist:'5SDccLeiVIAJGRk8IAJWwS', link:'https://open.spotify.com/playlist/5SDccLeiVIAJGRk8IAJWwS',
    prompt:'rust, kalmte, traagheid, gemak, genieten, ontspanning' },
  { id:3, label:'Us two',     icon:'🤝', glow:'#FF6B9D', accent:'rgba(255,107,157,0.55)', desc:'The playlist we made together.',      playlist:'65PQbepYO45KOuhEOVhM1c', link:'https://open.spotify.com/playlist/65PQbepYO45KOuhEOVhM1c',
    prompt:'verbondenheid, vriendschap, vertrouwen, samenzijn, gedeelde herinneringen, affectie' },
  { id:4, label:'Su',         icon:'✨', glow:'#C77DFF', accent:'rgba(199,125,255,0.55)', desc:'Just for you.',                       playlist:'0UU6eraNUqdRJ4nmE7G2uY', link:'https://open.spotify.com/playlist/0UU6eraNUqdRJ4nmE7G2uY',
    prompt:'bijzonderheid, authenticiteit, licht, moed, warmte, uitstraling' }
];

// ── STATE ─────────────────────────────────────────────────────────────────────
let currentMoodIdx = 0;
let currentPage = 'music';
let currentWord = null;
let loadedWords = {}; // cache: moodIdx -> word object

function getStorage() { try { return JSON.parse(localStorage.getItem('su_vocab')||'[]'); } catch(e){ return []; } }
function saveStorage(d) { try { localStorage.setItem('su_vocab', JSON.stringify(d)); } catch(e){} }

// ── MOOD SWITCH ───────────────────────────────────────────────────────────────
function switchMood(idx) {
  currentPage = 'music';
  currentMoodIdx = idx;
  const m = MOODS[idx];

  document.querySelectorAll('.nav-tab').forEach(t=>t.classList.remove('active'));
  document.querySelector(`.nav-tab[data-mood="${idx}"]`).classList.add('active');
  document.getElementById('page-music').classList.add('active');
  document.getElementById('page-vocab').classList.remove('active');

  document.documentElement.style.setProperty('--glow', m.glow);
  document.documentElement.style.setProperty('--accent', m.accent);

  document.getElementById('moodDesc').textContent = m.desc;
  document.getElementById('vinylIcon').textContent = m.icon;
  document.getElementById('openFull').href = m.link;

  // reset embed
  document.getElementById('embedWrap').classList.remove('visible');
  document.getElementById('embedWrap').innerHTML = '';
  document.getElementById('vinyl').classList.remove('playing');

  // load word (cached or new)
  if (loadedWords[idx]) {
    renderWord(loadedWords[idx]);
  } else {
    loadWord(false);
  }
}

function switchPage(page) {
  currentPage = page;
  document.querySelectorAll('.nav-tab').forEach(t=>t.classList.remove('active'));
  document.querySelector(`.nav-tab[data-page="vocab"]`).classList.add('active');
  document.getElementById('page-music').classList.remove('active');
  document.getElementById('page-vocab').classList.add('active');
  document.documentElement.style.setProperty('--glow','#ffffff');
  document.documentElement.style.setProperty('--accent','rgba(255,255,255,0.3)');
  renderVocabPage();
}

// ── SPOTIFY ───────────────────────────────────────────────────────────────────
function playRandom() {
  const m = MOODS[currentMoodIdx];
  const wrap = document.getElementById('embedWrap');
  const startTime = Math.floor(Math.random()*1800);
  wrap.innerHTML = `<iframe
    src="https://open.spotify.com/embed/playlist/${m.playlist}?utm_source=generator&theme=0&start_time=${startTime}"
    height="152"
    allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
    loading="lazy"
    style="border-radius:12px;display:block;"
  ></iframe>`;
  wrap.classList.add('visible');
  document.getElementById('vinyl').classList.add('playing');
}

// ── WORD via CLAUDE API ───────────────────────────────────────────────────────
async function loadWord(forceNew) {
  const idx = currentMoodIdx;
  const m = MOODS[idx];

  if (!forceNew && loadedWords[idx]) { renderWord(loadedWords[idx]); return; }

  document.getElementById('wordContent').innerHTML = `
    <div class="word-loading">
      <div class="dots"><span>●</span><span>●</span><span>●</span></div>
      <div style="margin-top:0.5rem">Een woord zoeken…</div>
    </div>`;

  const btn = document.getElementById('refreshBtn');
  btn.classList.add('spinning');
  setTimeout(()=>btn.classList.remove('spinning'), 400);

  // Build a list of already-shown words to avoid repeats
  const shown = Object.values(loadedWords).map(w=>w.woord).filter(Boolean);
  const avoid = shown.length ? `Vermijd deze woorden: ${shown.join(', ')}.` : '';

  const systemPrompt = `Je bent een Spaanse taaldocent voor Nederlandstalige leerders. Je geeft altijd één Spaans woord terug dat past bij het opgegeven thema. Antwoord ALLEEN met een JSON-object, geen uitleg erbuiten, geen markdown, geen backticks.`;

  const userPrompt = `Geef me één interessant Spaans woord dat hoort bij het thema: ${m.prompt}.
${avoid}
Het woord moet gevarieerd zijn: soms een zelfstandig naamwoord, soms een bijvoeglijk naamwoord, soms een werkwoord of idioom.

Geef het volgende JSON terug (alles in het NEDERLANDS behalve het Spaanse woord zelf en de voorbeeldzinnen):
{
  "woord": "het Spaanse woord",
  "woordsoort": "bijv. zelfstandig naamwoord (v) / werkwoord / bijvoeglijk naamwoord",
  "vertaling": "Nederlandse vertaling",
  "uitleg": "2-3 zinnen uitleg in het Nederlands: wat het betekent, hoe het gebruikt wordt, waarom het interessant is",
  "uitspraak": "fonetische uitspraak in het Spaans, bijv. ah-leh-GREE-ah",
  "voorbeelden": [
    { "es": "Spaanse zin", "nl": "Nederlandse vertaling" },
    { "es": "Spaanse zin", "nl": "Nederlandse vertaling" }
  ]
}`;

  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-api-key': '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', 'anthropic-version': '2023-06-01', 'anthropic-dangerous-direct-browser-access': 'true' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-6',
        max_tokens: 1000,
        system: systemPrompt,
        messages: [{ role: 'user', content: userPrompt }]
      })
    });
    const data = await res.json();
    const raw = data.content[0].text.trim();
    const clean = raw.replace(/```json|```/g,'').trim();
    const word = JSON.parse(clean);
    loadedWords[idx] = word;
    renderWord(word);
  } catch(err) {
    document.getElementById('wordContent').innerHTML = `<div class="word-loading" style="color:rgba(240,238,232,0.4)">Kon geen woord ophalen. Probeer opnieuw.</div>`;
  }
}

// ── RENDER WORD ───────────────────────────────────────────────────────────────
function renderWord(word) {
  currentWord = word;
  const stored = getStorage();
  const saved = stored.find(w=>w.woord===word.woord && w.moodIdx===currentMoodIdx);
  const rating = saved ? saved.rating : null;

  const voorbeelden = (word.voorbeelden||[]).map(e=>`
    <div class="example-line"><em>${e.es}</em></div>
    <div class="example-line" style="margin-bottom:10px;margin-left:1rem;font-size:12px;color:var(--muted)">${e.nl}</div>
  `).join('');

  document.getElementById('wordContent').innerHTML = `
    <div class="word-tag">Woord van de dag · ${MOODS[currentMoodIdx].label}</div>
    <div class="word-es">${word.woord}</div>
    <div class="word-type">${word.woordsoort||''}</div>
    <div class="word-nl-trans">${word.vertaling}</div>
    <div class="pron-row">
      <span class="pron-text">/${word.uitspraak}/</span>
      <button class="speak-btn" onclick="speakWord('${word.woord.replace(/'/g,"\\'")}')">
        <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
        Beluister
      </button>
    </div>
    <div class="word-uitleg">${word.uitleg}</div>
    ${voorbeelden ? `<div class="examples-label">Voorbeelden</div>${voorbeelden}` : ''}
    <div class="rating-row">
      <button class="rate-btn ${rating==='love'?'active-love':''}" onclick="rateWord('love')">❤️<span>Geweldig</span></button>
      <button class="rate-btn ${rating==='ok'?'active-ok':''}" onclick="rateWord('ok')">👍<span>Goed</span></button>
      <button class="rate-btn ${rating==='nope'?'active-nope':''}" onclick="rateWord('nope')">👎<span>Niet voor mij</span></button>
    </div>
    <div class="saved-msg ${rating?'ok':''}" id="savedMsg">${rating?'Opgeslagen ✓':''}</div>
  `;
}

// ── SPEECH ────────────────────────────────────────────────────────────────────
function speakWord(word) {
  if (!window.speechSynthesis) { alert('Speech not supported in this browser'); return; }
  window.speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(word);
  utter.lang = 'es-ES';
  utter.rate = 0.85;
  utter.pitch = 1;

  // Try to pick a Spanish voice
  const voices = window.speechSynthesis.getVoices();
  const esVoice = voices.find(v=>v.lang.startsWith('es'));
  if (esVoice) utter.voice = esVoice;
  window.speechSynthesis.speak(utter);
}

// Voices load async on some browsers
window.speechSynthesis && window.speechSynthesis.addEventListener('voiceschanged', ()=>{});

// ── RATING ────────────────────────────────────────────────────────────────────
function rateWord(rating) {
  if (!currentWord) return;
  const stored = getStorage();
  const filtered = stored.filter(w=>!(w.woord===currentWord.woord && w.moodIdx===currentMoodIdx));
  filtered.push({ ...currentWord, moodIdx: currentMoodIdx, moodLabel: MOODS[currentMoodIdx].label, rating, savedAt: Date.now() });
  saveStorage(filtered);

  // re-render buttons
  document.querySelectorAll('.rate-btn').forEach(b=>b.className='rate-btn');
  const map = {love:'active-love',ok:'active-ok',nope:'active-nope'};
  const btns = document.querySelectorAll('.rate-btn');
  const labels = ['love','ok','nope'];
  btns.forEach((b,i)=>{ if(labels[i]===rating) b.classList.add(map[rating]); });

  const msg = document.getElementById('savedMsg');
  if (msg) { msg.textContent='Opgeslagen ✓'; msg.classList.add('ok'); }
}

// ── VOCAB PAGE ────────────────────────────────────────────────────────────────
let activeFolder = 'all';

function filterFolder(f) {
  activeFolder = f;
  document.querySelectorAll('.folder-tab').forEach(t=>t.classList.remove('active'));
  document.querySelector(`.folder-tab[data-f="${f}"]`).classList.add('active');
  renderVocabList();
}

function renderVocabPage() {
  const stored = getStorage();
  const counts = {all:stored.length,love:0,ok:0,nope:0};
  stored.forEach(w=>{ if(counts[w.rating]!==undefined) counts[w.rating]++; });
  ['all','love','ok','nope'].forEach(f=>{ const el=document.getElementById(`cnt-${f}`); if(el) el.textContent=counts[f]||''; });
  renderVocabList();
}

function renderVocabList() {
  const stored = getStorage();
  const list = document.getElementById('vocabList');
  const filtered = activeFolder==='all' ? stored : stored.filter(w=>w.rating===activeFolder);
  if (!filtered.length) {
    list.innerHTML=`<div class="empty-state"><div class="big">📖</div>Nog geen woorden hier.<br>Beoordeel woorden in de mood-tabs om ze hier te zien.</div>`;
    return;
  }
  filtered.sort((a,b)=>b.savedAt-a.savedAt);
  list.innerHTML = filtered.map((w,i)=>{
    const emoji = w.rating==='love'?'❤️':w.rating==='ok'?'👍':'👎';
    const vb = (w.voorbeelden||[]).map(e=>`<div class="example-line"><em>${e.es}</em></div><div class="example-line" style="font-size:12px;color:var(--muted);margin-left:1rem;margin-bottom:8px">${e.nl}</div>`).join('');
    return `<div class="vocab-item" onclick="toggleVI(${i})">
      <div class="vi-header"><span class="vi-word">${w.woord}</span><span class="vi-rating">${emoji}</span></div>
      <div class="vi-nl">${w.vertaling} · <span style="font-size:11px;opacity:0.5">${w.moodLabel||''}</span></div>
      <div class="vi-detail" id="vi-${i}">
        <div class="vi-uitleg">${w.uitleg||''}</div>
        <div class="vi-pron-row">
          <span class="vi-pron">/${w.uitspraak}/</span>
          <button class="speak-btn" onclick="event.stopPropagation();speakWord('${(w.woord||'').replace(/'/g,"\\'")}')">
            <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
            Beluister
          </button>
        </div>
        ${vb ? `<div class="examples-label" style="margin-top:0.5rem">Voorbeelden</div>${vb}` : ''}
      </div>
    </div>`;
  }).join('');
}

function toggleVI(i) { const d=document.getElementById(`vi-${i}`); if(d) d.classList.toggle('open'); }

// ── INIT ──────────────────────────────────────────────────────────────────────
switchMood(0);
</script>
</body>
