<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Su's Space</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0D0D0F;
    --surface: #16161A;
    --surface2: #1E1E24;
    --border: rgba(255,255,255,0.07);
    --text: #F0EEE8;
    --muted: rgba(240,238,232,0.45);
    --glow: #ffffff;
    --accent: rgba(255,255,255,0.4);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Geist', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 0 1.25rem 4rem;
    overflow-x: hidden;
  }
  body::before {
    content: '';
    position: fixed;
    width: 500px; height: 500px;
    border-radius: 50%;
    top: -180px; left: 50%;
    transform: translateX(-50%);
    filter: blur(100px);
    opacity: 0.15;
    pointer-events: none;
    background: var(--glow);
    transition: background 0.9s ease;
    z-index: 0;
  }

  .top-nav {
    display: flex;
    justify-content: center;
    padding: 1.25rem 0 0;
    position: relative;
    z-index: 2;
    border-bottom: 1px solid var(--border);
    max-width: 780px;
    margin: 0 auto;
    gap: 0;
  }
  .nav-tab {
    padding: 0.65rem 0.75rem 0.6rem;
    cursor: pointer;
    font-size: 11px;
    color: var(--muted);
    border-bottom: 2px solid transparent;
    transition: color 0.2s, border-color 0.2s;
    white-space: nowrap;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    user-select: none;
    flex: 1;
  }
  .nav-tab .nav-icon { font-size: 1.2rem; line-height: 1; }
  .nav-tab:hover { color: var(--text); }
  .nav-tab.active { color: var(--text); border-bottom-color: var(--accent); }

  .page { display: none; max-width: 660px; margin: 0 auto; padding-top: 2.25rem; position: relative; z-index: 1; }
  .page.active { display: block; }

  .page-header { text-align: center; margin-bottom: 1.75rem; }
  .page-title { font-family: 'Instrument Serif', serif; font-size: clamp(1.5rem,4vw,2.2rem); font-weight: 400; line-height: 1.1; margin-bottom: 0.3rem; }
  .page-title em { font-style: italic; }
  .page-sub { font-size: 13px; color: var(--muted); }

  @keyframes spin { from{transform:rotate(0deg)} to{transform:rotate(360deg)} }
  .vinyl {
    width: 110px; height: 110px; border-radius: 50%;
    background: conic-gradient(#1c1c1c 0deg,#272727 40deg,#1c1c1c 80deg,#272727 120deg,#1c1c1c 160deg,#272727 200deg,#1c1c1c 240deg,#272727 280deg,#1c1c1c 320deg,#272727 360deg);
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 1.25rem; position: relative;
  }
  .vinyl.playing { animation: spin 5s linear infinite; }
  .vinyl-ring { position: absolute; border-radius: 50%; border: 1px solid rgba(255,255,255,0.05); }
  .vr1{width:65px;height:65px} .vr2{width:83px;height:83px} .vr3{width:100px;height:100px}
  .vinyl-center { width: 30px; height: 30px; border-radius: 50%; background: var(--bg); border: 1.5px solid rgba(255,255,255,0.1); z-index: 1; display:flex; align-items:center; justify-content:center; font-size:12px; }

  .play-wrap { display:flex; flex-direction:column; align-items:center; gap:0.75rem; margin-bottom:1.25rem; }
  .play-btn {
    width: 68px; height: 68px; border-radius: 50%;
    border: 1.5px solid var(--accent);
    background: rgba(255,255,255,0.04);
    cursor: pointer;
    display:flex; align-items:center; justify-content:center;
    transition: transform 0.2s, background 0.2s;
  }
  .play-btn:hover { transform: scale(1.08); background: rgba(255,255,255,0.09); }
  .play-btn svg { width: 22px; height: 22px; fill: var(--text); margin-left: 3px; }
  .play-hint { font-size: 12px; color: var(--muted); }

  .embed-wrap { border-radius: 12px; overflow: hidden; width: 100%; display: none; }
  .embed-wrap.visible { display: block; }
  .embed-wrap iframe { width: 100%; border: none; border-radius: 12px; display: block; }
  .open-full { display:block; text-align:center; margin-top:0.6rem; font-size:12px; color:var(--muted); text-decoration:none; transition:color 0.2s; }
  .open-full:hover { color: var(--text); }

  /* WORD CARD */
  .word-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 1.5rem;
    margin-top: 1.75rem;
    position: relative;
  }
  .word-loading {
    text-align: center;
    padding: 2rem 1rem;
    color: var(--muted);
    font-size: 13px;
  }
  .word-loading .dots span { animation: blink 1.4s infinite; display: inline-block; }
  .word-loading .dots span:nth-child(2) { animation-delay: 0.2s; }
  .word-loading .dots span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes blink { 0%,80%,100%{opacity:0.2} 40%{opacity:1} }

  .word-tag { font-size: 10px; letter-spacing:0.12em; color:var(--muted); text-transform:uppercase; margin-bottom:0.6rem; display:flex; align-items:center; gap:6px; }
  .word-tag::before { content:''; display:inline-block; width:6px; height:6px; border-radius:50%; background:var(--accent); }
  .word-es { font-family:'Instrument Serif',serif; font-size:2rem; font-style:italic; margin-bottom:0.15rem; }
  .word-type { font-size:11px; color:var(--muted); margin-bottom:0.4rem; }
  .word-nl-trans { font-size:1rem; font-weight:300; color:rgba(240,238,232,0.7); margin-bottom:0.85rem; }

  .pron-row { display:flex; align-items:center; gap:10px; margin-bottom:1rem; }
  .pron-text { font-size:13px; color:var(--muted); font-family:monospace; }
  .speak-btn {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 5px 12px;
    cursor: pointer;
    font-size: 12px;
    color: var(--muted);
    display: flex; align-items: center; gap: 5px;
    transition: border-color 0.2s, color 0.2s;
    font-family: 'Geist', sans-serif;
  }
  .speak-btn:hover { border-color: rgba(255,255,255,0.2); color: var(--text); }
  .speak-btn svg { width:13px; height:13px; fill:currentColor; }

  .word-uitleg { font-size: 13px; line-height: 1.7; color: rgba(240,238,232,0.75); margin-bottom: 1rem; }

  .examples-label { font-size:10px; letter-spacing:0.1em; text-transform:uppercase; color:var(--muted); margin-bottom:0.4rem; }
  .example-line { font-size:13px; color:rgba(240,238,232,0.6); margin-bottom:6px; line-height:1.55; }
  .example-line em { color:rgba(240,238,232,0.85); font-style:normal; }

  .rating-row { display:flex; gap:8px; margin-top:1.25rem; }
  .rate-btn {
    flex:1; background:var(--surface2); border:1px solid var(--border); border-radius:8px;
    padding:9px 6px; cursor:pointer; text-align:center; font-size:18px;
    transition: border-color 0.2s, background 0.2s;
  }
  .rate-btn span { display:block; font-size:10px; color:var(--muted); margin-top:3px; font-family:'Geist',sans-serif; }
  .rate-btn:hover { border-color:rgba(255,255,255,0.2); }
  .rate-btn.active-love { border-color:#FF6B9D; background:rgba(255,107,157,0.1); }
  .rate-btn.active-ok   { border-color:#6BCB77; background:rgba(107,203,119,0.1); }
  .rate-btn.active-nope { border-color:#8B9DC3; background:rgba(139,157,195,0.1); }

  .saved-msg { font-size:12px; color:var(--muted); text-align:center; margin-top:0.6rem; min-height:16px; }
  .saved-msg.ok { color:#6BCB77; }

  .refresh-word { background:none; border:none; cursor:pointer; color:var(--muted); font-size:11px; font-family:'Geist',sans-serif; position:absolute; top:1.25rem; right:1.25rem; display:flex; align-items:center; gap:4px; transition:color 0.2s; padding:4px 8px; border-radius:4px; }
  .refresh-word:hover { color:var(--text); }
  .refresh-word svg { width:12px; height:12px; fill:currentColor; transition:transform 0.4s; }
  .refresh-word.spinning svg { transform:rotate(360deg); }

  /* VOCAB PAGE */
  .folder-tabs { display:flex; gap:6px; margin-bottom:1.5rem; flex-wrap:wrap; }
  .folder-tab { padding:6px 14px; border:1px solid var(--border); border-radius:20px; font-size:12px; cursor:pointer; color:var(--muted); background:var(--surface); transition:all 0.15s; }
  .folder-tab:hover { color:var(--text); border-color:rgba(255,255,255,0.2); }
  .folder-tab.active { color:var(--text); border-color:rgba(255,255,255,0.4); }
  .folder-tab .cnt { font-size:10px; opacity:0.55; margin-left:3px; }

  .vocab-list { display:flex; flex-direction:column; gap:10px; }
  .vocab-item { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:1rem 1.25rem; cursor:pointer; transition:border-color 0.2s; }
  .vocab-item:hover { border-color:rgba(255,255,255,0.15); }
  .vi-header { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:3px; }
  .vi-word { font-family:'Instrument Serif',serif; font-size:1.2rem; font-style:italic; }
  .vi-rating { font-size:15px; }
  .vi-nl { font-size:12px; color:var(--muted); margin-bottom:0; }
  .vi-detail { display:none; margin-top:10px; padding-top:10px; border-top:1px solid var(--border); }
  .vi-detail.open { display:block; }
  .vi-uitleg { font-size:13px; line-height:1.65; color:rgba(240,238,232,0.75); margin-bottom:0.75rem; }
  .vi-pron-row { display:flex; align-items:center; gap:8px; margin-bottom:0.75rem; }
  .vi-pron { font-size:12px; color:var(--muted); font-family:monospace; }

  .empty-state { text-align:center; padding:3rem 1rem; color:var(--muted); font-size:14px; line-height:1.7; }
  .empty-state .big { font-size:2.5rem; margin-bottom:0.75rem; }

  @media(max-width:480px){
    .nav-tab{font-size:10px; padding:0.5rem 0.4rem;}
    .nav-icon{font-size:1rem !important;}
  }
</style>
</head>
<body>

<nav class="top-nav" id="topNav">
  <div class="nav-tab active" data-mood="0" onclick="switchMood(0)"><span class="nav-icon">🌤️</span>Cheer up</div>
  <div class="nav-tab" data-mood="1" onclick="switchMood(1)"><span class="nav-icon">🌧️</span>Melancholy</div>
  <div class="nav-tab" data-mood="2" onclick="switchMood(2)"><span class="nav-icon">🌿</span>Chill</div>
  <div class="nav-tab" data-mood="3" onclick="switchMood(3)"><span class="nav-icon">🤝</span>Us two</div>
  <div class="nav-tab" data-mood="4" onclick="switchMood(4)"><span class="nav-icon">✨</span>Su</div>
  <div class="nav-tab" data-page="vocab" onclick="switchPage('vocab')"><span class="nav-icon">📚</span>My words</div>
</nav>

<!-- MUSIC PAGE -->
<div class="page active" id="page-music">
  <div class="page-header">
    <h1 class="page-title">How are you <em>feeling?</em></h1>
    <p class="page-sub" id="moodDesc">For when you need a little push.</p>
  </div>
  <div class="vinyl" id="vinyl"><div class="vinyl-ring vr1"></div><div class="vinyl-ring vr2"></div><div class="vinyl-ring vr3"></div><div class="vinyl-center" id="vinylIcon">🌤️</div></div>

  <div class="embed-wrap" id="embedWrap"></div>
  <a class="open-full" id="openFull" href="#" target="_blank">Open full playlist in Spotify ↗</a>

  <!-- WORD CARD -->
  <div class="word-card" id="wordCard">
    <button class="refresh-word" id="refreshBtn" onclick="loadWord(true)" title="New word">
      <svg viewBox="0 0 24 24"><path d="M17.65 6.35A7.96 7.96 0 0 0 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08A5.99 5.99 0 0 1 12 18c-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
      New word
    </button>
    <div id="wordContent">
      <div class="word-loading">
        <div class="dots"><span>●</span><span>●</span><span>●</span></div>
        <div style="margin-top:0.5rem">Fetching a word…</div>
      </div>
    </div>
  </div>
</div>

<!-- VOCAB PAGE -->
<div class="page" id="page-vocab">
  <div class="page-header">
    <h1 class="page-title">My <em>words</em></h1>
    <p class="page-sub">Tap a word to read more — including pronunciation</p>
    <div style="display:flex;gap:8px;justify-content:center;margin-top:1rem;">
      <button onclick="exportWords()" style="background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:7px 16px;font-size:12px;color:var(--muted);cursor:pointer;font-family:Geist,sans-serif;transition:color 0.2s,border-color 0.2s;" onmouseover="this.style.color='var(--text)';this.style.borderColor='rgba(255,255,255,0.2)'" onmouseout="this.style.color='var(--muted)';this.style.borderColor='var(--border)'">⬇ Save backup</button>
      <label style="background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:7px 16px;font-size:12px;color:var(--muted);cursor:pointer;font-family:Geist,sans-serif;transition:color 0.2s,border-color 0.2s;" onmouseover="this.style.color='var(--text)';this.style.borderColor='rgba(255,255,255,0.2)'" onmouseout="this.style.color='var(--muted)';this.style.borderColor='var(--border)'">⬆ Load backup<input type="file" accept=".json" onchange="importWords(event)" style="display:none"></label>
    </div>
  </div>
  <div class="folder-tabs">
    <div class="folder-tab active" data-f="all"  onclick="filterFolder('all')">All <span class="cnt" id="cnt-all"></span></div>
    <div class="folder-tab" data-f="love" onclick="filterFolder('love')">❤️ Love it <span class="cnt" id="cnt-love"></span></div>
    <div class="folder-tab" data-f="ok"   onclick="filterFolder('ok')">👍 OK <span class="cnt" id="cnt-ok"></span></div>
    <div class="folder-tab" data-f="nope" onclick="filterFolder('nope')">👎 Not for me <span class="cnt" id="cnt-nope"></span></div>
  </div>
  <div class="vocab-list" id="vocabList"></div>
</div>

<script>
// ── CONFIG ────────────────────────────────────────────────────────────────────
const MOODS = [
  { id:0, label:'Cheer up',   icon:'☕', glow:'#FFD166', accent:'rgba(255,209,102,0.55)', desc:'For when you need a little push.',    playlist:'6o871dkZuW4YYdDnbr7Bal', link:'https://open.spotify.com/playlist/6o871dkZuW4YYdDnbr7Bal',
    prompt:'alegría, entusiasmo, energía positiva, motivación, celebración, optimismo' },
  { id:1, label:'Melancholy', icon:'🌧️', glow:'#8B9DC3', accent:'rgba(139,157,195,0.55)', desc:'Sometimes you just need to feel it.', playlist:'0u4EM2JCZEWQZMTzI7wwxw', link:'https://open.spotify.com/playlist/0u4EM2JCZEWQZMTzI7wwxw',
    prompt:'melancholie, nostalgie, stilte, gemis, vergankelijkheid, weemoed' },
  { id:2, label:'Chill',      icon:'🌿', glow:'#6BCB77', accent:'rgba(107,203,119,0.55)', desc:'Low effort. High vibe.',              playlist:'5SDccLeiVIAJGRk8IAJWwS', link:'https://open.spotify.com/playlist/5SDccLeiVIAJGRk8IAJWwS',
    prompt:'rust, kalmte, traagheid, gemak, genieten, ontspanning' },
  { id:3, label:'Us two',     icon:'🤝', glow:'#FF6B9D', accent:'rgba(255,107,157,0.55)', desc:'A playlist to create together.',      playlist:'65PQbepYO45KOuhEOVhM1c', link:'https://open.spotify.com/playlist/65PQbepYO45KOuhEOVhM1c',
    prompt:'verbondenheid, vriendschap, vertrouwen, samenzijn, gedeelde herinneringen, affectie' },
  { id:4, label:'Su',         icon:'✨', glow:'#C77DFF', accent:'rgba(199,125,255,0.55)', desc:'Just Su.',                       playlist:'0UU6eraNUqdRJ4nmE7G2uY', link:'https://open.spotify.com/playlist/0UU6eraNUqdRJ4nmE7G2uY',
    prompt:'bijzonderheid, authenticiteit, licht, moed, warmte, uitstraling' }
];


// ── WORD BANK (300+ words, organised by mood, all explanations in Dutch) ─────
const WORDS = {
  0: [ // Cheer up — alegría, energie, positiviteit
    {woord:'alegría',woordsoort:'zelfstandig naamwoord (v)',vertaling:'vreugde / blijdschap',uitleg:'Alegría is meer dan geluk — het is een uitbundige, zichtbare vreugde. In de Spaanse cultuur is alegría bijna een levensstijl: luid lachen, dansen, samen genieten.',uitspraak:'ah-leh-GREE-ah',voorbeelden:[{es:'¡Qué alegría verte!',nl:'Wat fijn om je te zien!'},{es:'Su cara irradiaba alegría.',nl:'Haar gezicht straalde van vreugde.'}]},
    {woord:'chispa',woordsoort:'zelfstandig naamwoord (v)',vertaling:'vonk / pit / fut',uitleg:'Chispa betekent letterlijk vonk, maar wordt ook gebruikt voor iemand met energie en charme. Iemand met chispa maakt een kamer levendiger alleen al door er te zijn.',uitspraak:'CHEES-pah',voorbeelden:[{es:'Tiene mucha chispa.',nl:'Ze heeft zoveel pit.'},{es:'La conversación tuvo chispa.',nl:'Het gesprek had echte vonken.'}]},
    {woord:'genial',woordsoort:'bijvoeglijk naamwoord',vertaling:'geweldig / super',uitleg:'In het Spaans is genial het meest gebruikte woord voor "geweldig". Het is informeel en enthousiast — precies wat je zegt als iets je verrast of blij maakt.',uitspraak:'heh-NYAL',voorbeelden:[{es:'¡Qué idea tan genial!',nl:'Wat een geweldig idee!'},{es:'La fiesta fue genial.',nl:'Het feest was super.'}]},
    {woord:'disfrutar',woordsoort:'werkwoord',vertaling:'genieten / ervan genieten',uitleg:'Disfrutar is meer dan "leuk vinden" — het betekent bewust genieten, het moment in je opnemen. Spanjaarden gebruiken het veel: disfruta la vida.',uitspraak:'dees-froo-TAR',voorbeelden:[{es:'Disfruta el momento.',nl:'Geniet van het moment.'},{es:'Me encanta disfrutar de un buen café.',nl:'Ik hou ervan om van een goede koffie te genieten.'}]},
    {woord:'maravilloso',woordsoort:'bijvoeglijk naamwoord',vertaling:'prachtig / wonderlijk',uitleg:'Sterker dan "mooi" of "leuk" — maravilloso gebruik je als iets je echt verbijstert of overweldigt. Afgeleid van maravilla (wonder).',uitspraak:'mah-rah-vee-YO-so',voorbeelden:[{es:'Qué día tan maravilloso.',nl:'Wat een prachtige dag.'},{es:'Es un lugar maravilloso.',nl:'Het is een wonderlijke plek.'}]},
    {woord:'estrenar',woordsoort:'werkwoord',vertaling:'iets voor het eerst gebruiken / in première gaan',uitleg:'Estrenar heeft geen Nederlands equivalent. Je estrenas kleding (voor het eerst aantrekken), een film (première), of een appartement. Er zit een ritueel gevoel aan — het is speciaal.',uitspraak:'es-treh-NAR',voorbeelden:[{es:'Hoy estreno este vestido.',nl:'Vandaag draag ik deze jurk voor het eerst.'},{es:'La peli se estrena mañana.',nl:'De film gaat morgen in première.'}]},
    {woord:'ánimo',woordsoort:'zelfstandig naamwoord (m)',vertaling:'moed / energie / aanmoediging',uitleg:'¡Ánimo! is wat je roept als iemand aanmoediging nodig heeft. Het betekent ook de innerlijke kracht om door te gaan — geest en energie tegelijk.',uitspraak:'AH-nee-mo',voorbeelden:[{es:'¡Ánimo, que tú puedes!',nl:'Kom op, jij kan het!'},{es:'Hoy tengo mucho ánimo.',nl:'Vandaag heb ik veel energie.'}]},
    {woord:'ilusión',woordsoort:'zelfstandig naamwoord (v)',vertaling:'enthousiasme / verwachting / hoop',uitleg:'In het Spaans betekent ilusión niet alleen "illusie" maar ook het opgewonden gevoel van iets verwachten. Tengo mucha ilusión = ik verheug me er enorm op.',uitspraak:'ee-loo-SYON',voorbeelden:[{es:'Tengo mucha ilusión por el viaje.',nl:'Ik verheug me enorm op de reis.'},{es:'¡Qué ilusión!',nl:'Wat spannend!'}]},
    {woord:'bullicioso',woordsoort:'bijvoeglijk naamwoord',vertaling:'bruisend / levendig / rumoerig',uitleg:'Beschrijft een plek of persoon vol leven en lawaai — maar op een prettige manier. Een bullicioso plein op een zomerse avond is precies waar je wil zijn.',uitspraak:'boo-lee-THYO-so',voorbeelden:[{es:'El mercado estaba bullicioso.',nl:'De markt was bruisend van leven.'},{es:'Era una niña muy bulliciosa.',nl:'Ze was een heel levendig meisje.'}]},
    {woord:'vivaz',woordsoort:'bijvoeglijk naamwoord',vertaling:'levendig / vlot / pittig',uitleg:'Vivaz beschrijft iemand of iets vol energie en scherpte. Het wordt gebruikt voor mensen die snel denken, snel praten en een aanstekelijke energie hebben.',uitspraak:'vee-VATH',voorbeelden:[{es:'Es una persona muy vivaz.',nl:'Ze is een heel levendig persoon.'},{es:'Tiene un humor vivaz.',nl:'Ze heeft een scherp gevoel voor humor.'}]},
    {woord:'entusiasmo',woordsoort:'zelfstandig naamwoord (m)',vertaling:'enthousiasme',uitleg:'Hetzelfde als in het Nederlands, maar Spanjaarden gebruiken het met veel meer gevoel. Con entusiasmo doen betekent er echt voor gaan.',uitspraak:'en-too-SYAS-mo',voorbeelden:[{es:'Lo hace todo con entusiasmo.',nl:'Ze doet alles met enthousiasme.'},{es:'Su entusiasmo es contagioso.',nl:'Haar enthousiasme is aanstekelijk.'}]},
    {woord:'gozo',woordsoort:'zelfstandig naamwoord (m)',vertaling:'vreugde / genot',uitleg:'Gozo is een diepere, rustiger vreugde dan alegría — meer innerlijk, bijna spiritueel. Je voelt gozo als iets je echt goed doet.',uitspraak:'GO-tho',voorbeelden:[{es:'Sintió un gozo profundo.',nl:'Ze voelde een diepe vreugde.'},{es:'El gozo de vivir.',nl:'De vreugde van het leven.'}]},
    {woord:'festivo',woordsoort:'bijvoeglijk naamwoord',vertaling:'feestelijk / vrolijk',uitleg:'Festivo verwijst naar feestdagen maar ook naar een feestelijke sfeer of stemming. Een ambiente festivo is een sfeer waar je je meteen blij van voelt.',uitspraak:'fes-TEE-vo',voorbeelden:[{es:'Había un ambiente muy festivo.',nl:'Er hing een heel feestelijke sfeer.'},{es:'Es un día festivo.',nl:'Het is een feestdag.'}]},
    {woord:'derroche',woordsoort:'zelfstandig naamwoord (m)',vertaling:'overdaad / verkwisting (positief gebruikt)',uitleg:'Letterlijk "verspilling", maar in positieve context: een derroche de alegría is een overdaad aan vrolijkheid. Je gooit er met blijdschap mee.',uitspraak:'deh-RRO-cheh',voorbeelden:[{es:'Un derroche de energía.',nl:'Een overvloed aan energie.'},{es:'Bailó con un derroche de pasión.',nl:'Ze danste met een uitbundige passie.'}]},
    {woord:'radiante',woordsoort:'bijvoeglijk naamwoord',vertaling:'stralend',uitleg:'Iemand die radiante is straalt van binnen naar buiten. Je ziet het aan hun gezicht, hun energie. Gebruikt voor mensen, glimlachen en ook voor het weer.',uitspraak:'rah-DYAN-teh',voorbeelden:[{es:'Estás radiante hoy.',nl:'Je straalt vandaag.'},{es:'Una sonrisa radiante.',nl:'Een stralende glimlach.'}]},
    {woord:'alborozo',woordsoort:'zelfstandig naamwoord (m)',vertaling:'uitgelaten vreugde / uitbundigheid',uitleg:'Alborozo is de uitbundige, bijna lawaaierige vreugde die je voelt bij heel goed nieuws. Sterker dan alegría, minder alledaags.',uitspraak:'al-bo-RO-tho',voorbeelden:[{es:'La noticia causó alborozo.',nl:'Het nieuws zorgde voor uitgelaten vreugde.'},{es:'Gritó de alborozo.',nl:'Ze schreeuwde het uit van blijdschap.'}]},
    {woord:'euforia',woordsoort:'zelfstandig naamwoord (v)',vertaling:'euforie',uitleg:'Extreme, overweldigende vreugde. Euforia gebruik je voor momenten van intense opwinding — na een overwinning, goed nieuws, of een bijzonder moment.',uitspraak:'eh-oo-FO-rya',voorbeelden:[{es:'Sentí una euforia enorme.',nl:'Ik voelde een enorme euforie.'},{es:'La euforia del público era contagiosa.',nl:'De euforie van het publiek was aanstekelijk.'}]},
    {woord:'vitalidad',woordsoort:'zelfstandig naamwoord (v)',vertaling:'vitaliteit / levenskracht',uitleg:'Vitalidad is de energie en levenskracht die je van iemand afvoelt. Iemand met vitalidad lijkt nooit moe en brengt leven in de kamer.',uitspraak:'vee-tah-lee-DAD',voorbeelden:[{es:'Irradia vitalidad.',nl:'Ze straalt vitaliteit uit.'},{es:'Su vitalidad es increíble.',nl:'Haar levenskracht is ongelooflijk.'}]},
    {woord:'brillo',woordsoort:'zelfstandig naamwoord (m)',vertaling:'glans / schittering / glinstering',uitleg:'Brillo is de glans die je ziet in ogen die stralen, of de schittering van iets moois. Ook figuurlijk: el brillo de su mirada = de glans in haar blik.',uitspraak:'BREE-yo',voorbeelden:[{es:'El brillo de sus ojos me encantó.',nl:'De glans in haar ogen fascineerde me.'},{es:'Hay un brillo especial en ella.',nl:'Er is een bijzondere glans in haar.'}]},
    {woord:'plenitud',woordsoort:'zelfstandig naamwoord (v)',vertaling:'volheid / vervulling',uitleg:'Plenitud is het gevoel dat niets ontbreekt — volledigheid en tevredenheid tegelijk. Je voelt plenitud als je precies op de goede plek bent.',uitspraak:'pleh-nee-TOOD',voorbeelden:[{es:'Vivo con plenitud.',nl:'Ik leef met een gevoel van vervulling.'},{es:'Siente la plenitud del momento.',nl:'Voel de volheid van het moment.'}]},
    {woord:'espontáneo',woordsoort:'bijvoeglijk naamwoord',vertaling:'spontaan',uitleg:'Iemand die espontáneo is handelt vanuit het hart, zonder nadenken of plannen. In de Spaanse cultuur wordt spontaniteit erg gewaardeerd.',uitspraak:'es-pon-TAH-neh-o',voorbeelden:[{es:'Es muy espontánea.',nl:'Ze is heel spontaan.'},{es:'Un gesto espontáneo.',nl:'Een spontaan gebaar.'}]},
    {woord:'desenfadado',woordsoort:'bijvoeglijk naamwoord',vertaling:'ontspannen / zorgeloos / nonchalant',uitleg:'Desenfadado beschrijft iemand die licht is, geen zorgen draagt en door het leven gaat zonder zichzelf serieus te nemen. Een positieve eigenschap.',uitspraak:'des-en-fah-DAH-do',voorbeelden:[{es:'Tiene un estilo desenfadado.',nl:'Ze heeft een ontspannen stijl.'},{es:'Su actitud desenfadada me gusta.',nl:'Ik hou van haar zorgeloze houding.'}]},
    {woord:'celebrar',woordsoort:'werkwoord',vertaling:'vieren / veroorzaken',uitleg:'Celebrar is zowel "vieren" (een feest) als "toejuichen". In het dagelijks Spaans vieren mensen kleine dingen ook — een goed cijfer, een mooie dag.',uitspraak:'theh-leh-BRAR',voorbeelden:[{es:'¡Hay que celebrarlo!',nl:'Dat moet gevierd worden!'},{es:'Celebraron la noticia juntos.',nl:'Ze vierden het nieuws samen.'}]},
    {woord:'júbilo',woordsoort:'zelfstandig naamwoord (m)',vertaling:'jubelende vreugde / jubeling',uitleg:'Júbilo is de vreugde die je voelt als je wil uitroepen en springen. Formeler dan alegría, maar intenser. Wordt veel gebruikt in literatuur en muziek.',uitspraak:'HOO-bee-lo',voorbeelden:[{es:'Un grito de júbilo.',nl:'Een jubelkreet.'},{es:'El júbilo del equipo era enorme.',nl:'De jubelende vreugde van het team was enorm.'}]},
    {woord:'salero',woordsoort:'zelfstandig naamwoord (m)',vertaling:'charme / pit / gratie',uitleg:'Salero is een typisch Spaans woord voor de combinatie van charme, gratie en humor. Letterlijk "zoutvat" — iemand met salero brengt smaak in het leven.',uitspraak:'sah-LEH-ro',voorbeelden:[{es:'Baila con mucho salero.',nl:'Ze danst met veel gratie en charme.'},{es:'Tiene un salero natural.',nl:'Ze heeft een natuurlijke charme.'}]},
    {woord:'luminoso',woordsoort:'bijvoeglijk naamwoord',vertaling:'lichtend / helder / stralend',uitleg:'Luminoso beschrijft alles wat licht uitstraalt — een kamer, een dag, maar ook een persoon die helderheid en warmte brengt.',uitspraak:'loo-mee-NO-so',voorbeelden:[{es:'Una sonrisa luminosa.',nl:'Een stralende glimlach.'},{es:'Un día luminoso y alegre.',nl:'Een heldere, vrolijke dag.'}]},
    {woord:'risueño',woordsoort:'bijvoeglijk naamwoord',vertaling:'glimlachend / vrolijk / blij van aard',uitleg:'Risueño beschrijft iemand die altijd een glimlach heeft, van nature vrolijk is. Afgeleid van risa (lach) — een persoon die de lach dichtbij draagt.',uitspraak:'ree-SWEH-nyo',voorbeelden:[{es:'Tiene un carácter risueño.',nl:'Ze heeft een vrolijk karakter.'},{es:'Una cara risueña.',nl:'Een glimlachend gezicht.'}]},
    {woord:'optimismo',woordsoort:'zelfstandig naamwoord (m)',vertaling:'optimisme',uitleg:'Hetzelfde als in het Nederlands, maar in de Spaanse context heeft optimismo een praktische lading — het is niet naïef, het is een bewuste keuze.',uitspraak:'op-tee-MEES-mo',voorbeelden:[{es:'Vive con optimismo.',nl:'Ze leeft met optimisme.'},{es:'El optimismo es contagioso.',nl:'Optimisme is aanstekelijk.'}]},
    {woord:'desparpajo',woordsoort:'zelfstandig naamwoord (m)',vertaling:'onbevangenheid / lef / nonchalance',uitleg:'Desparpajo is de eigenschap om zonder schaamte of verlegenheid je eigen gang te gaan. Iemand met desparpajo zegt wat ze denkt en doet het met stijl.',uitspraak:'des-par-PAH-ho',voorbeelden:[{es:'Habla con mucho desparpajo.',nl:'Ze praat met grote onbevangenheid.'},{es:'Su desparpajo me sorprende.',nl:'Haar lef verrast me altijd.'}]},
    {woord:'destellar',woordsoort:'werkwoord',vertaling:'schitteren / fonkelen',uitleg:'Destellar is het flikkeren of schitteren van licht of ogen. Als iemands ogen destellan kijken ze met een vonk van leven of blijdschap.',uitspraak:'des-teh-YAR',voorbeelden:[{es:'Sus ojos destellaban de alegría.',nl:'Haar ogen schitterden van vreugde.'},{es:'Las estrellas destellan en el cielo.',nl:'De sterren fonkelen aan de hemel.'}]},
    {woord:'jarana',woordsoort:'zelfstandig naamwoord (v)',vertaling:'feestpret / herrie / lol',uitleg:'Jarana is informeel voor feeststemming en herrie — de soort avond waarop iedereen lacht, danst en lawaai maakt. Ir de jarana = op stap gaan.',uitspraak:'hah-RAH-nah',voorbeelden:[{es:'Salieron de jarana hasta las 3.',nl:'Ze gingen op stap tot 3 uur.'},{es:'¡Vamos de jarana!',nl:'Laten we feesten!'}]},
    {woord:'regocijo',woordsoort:'zelfstandig naamwoord (m)',vertaling:'uitgelatenheid / prettige opwinding',uitleg:'Regocijo is de vreugde die je voelt bij iets grappigs of moois — een lach van binnen. Formeler dan "lol", expressiever dan "plezier".',uitspraak:'reh-go-THEE-ho',voorbeelden:[{es:'El chiste causó regocijo general.',nl:'De grap zorgde voor algemene vrolijkheid.'},{es:'Siento regocijo cuando te veo.',nl:'Ik voel vrolijkheid als ik je zie.'}]},
    {woord:'zozobra',woordsoort:'zelfstandig naamwoord (v) [antonym]',vertaling:'onrust / angst — het tegenovergestelde van vrolijkheid',uitleg:'Zozobra is de innerlijke onrust en bezorgdheid. We leren het als contrast — als je zozobra kent, weet je ook beter wat je mist als het weg is.',uitspraak:'tho-THO-brah',voorbeelden:[{es:'Sin zozobra, solo alegría.',nl:'Geen onrust, alleen vreugde.'},{es:'Superó su zozobra interior.',nl:'Ze overwon haar innerlijke onrust.'}]},
    {woord:'apasionado',woordsoort:'bijvoeglijk naamwoord',vertaling:'gepassioneerd / vurig',uitleg:'Iemand die apasionado is doet alles met hart en ziel. Geen halfslachtige pogingen — alles of niets. Een heel Spaans begrip.',uitspraak:'ah-pah-syo-NAH-do',voorbeelden:[{es:'Es una bailarina apasionada.',nl:'Ze is een gepassioneerde danseres.'},{es:'Habla de forma apasionada.',nl:'Ze praat op een vurige manier.'}]},
    {woord:'fascinante',woordsoort:'bijvoeglijk naamwoord',vertaling:'fascinerend / boeiend',uitleg:'Wat je aandacht volledig grijpt en vasthoudt. In het Spaans wordt het veel gebruikt om mensen, plekken of ideeën te beschrijven die je niet los kunnen laten.',uitspraak:'fah-thee-NAN-teh',voorbeelden:[{es:'Es una persona fascinante.',nl:'Ze is een fascinerend persoon.'},{es:'Qué idea tan fascinante.',nl:'Wat een boeiend idee.'}]},
    {woord:'esperanzador',woordsoort:'bijvoeglijk naamwoord',vertaling:'hoopgevend / veelbelovend',uitleg:'Iets dat esperanzador is geeft je hoop voor de toekomst. Een woord dat optimisme en mogelijkheden in zich draagt.',uitspraak:'es-peh-ran-tha-DOR',voorbeelden:[{es:'Las noticias son esperanzadoras.',nl:'Het nieuws is hoopgevend.'},{es:'Un comienzo esperanzador.',nl:'Een veelbelovend begin.'}]},
    {woord:'pletórico',woordsoort:'bijvoeglijk naamwoord',vertaling:'overvloedig / overlopen van',uitleg:'Pletórico de algo betekent overlopen van iets — van vreugde, energie of enthousiasme. Bijna te vol om in te bevatten.',uitspraak:'pleh-TO-ree-co',voorbeelden:[{es:'Está pletórica de felicidad.',nl:'Ze loopt over van geluk.'},{es:'Un estadio pletórico de gente.',nl:'Een stadion vol tot de nok.'}]},
    {woord:'simpatía',woordsoort:'zelfstandig naamwoord (v)',vertaling:'sympathie / vriendelijkheid / charme',uitleg:'In het Spaans is simpatía meer dan medelijden — het is de eigenschap aantrekkelijk en vriendelijk te zijn. Ser simpático is een groot compliment.',uitspraak:'seem-pah-TEE-ah',voorbeelden:[{es:'Me cae bien, tiene mucha simpatía.',nl:'Ik mag haar graag, ze is erg charmant.'},{es:'Su simpatía conquistó a todos.',nl:'Haar vriendelijkheid won iedereen voor zich.'}]},
    {woord:'alegre',woordsoort:'bijvoeglijk naamwoord',vertaling:'vrolijk / blij',uitleg:'Het simpelste en meest gebruikte woord voor vrolijk. Alegre beschrijft zowel mensen als plaatsen, muziek en sfeer.',uitspraak:'ah-LEH-greh',voorbeelden:[{es:'Siempre está alegre.',nl:'Ze is altijd vrolijk.'},{es:'Una música alegre.',nl:'Vrolijke muziek.'}]},
    {woord:'fiesta',woordsoort:'zelfstandig naamwoord (v)',vertaling:'feest / feestdag',uitleg:'Fiesta is meer dan een partijtje — het is een cultureel ritueel in Spanje. De fiesta brengt mensen samen, doorbreekt de routine en viert het leven.',uitspraak:'FYES-tah',voorbeelden:[{es:'¡Vamos de fiesta!',nl:'We gaan feesten!'},{es:'Hoy es día de fiesta.',nl:'Vandaag is het een feestdag.'}]},
    {woord:'ganas',woordsoort:'zelfstandig naamwoord (mv)',vertaling:'zin in iets / motivatie / trek',uitleg:'Tener ganas de algo = zin hebben in iets. Het is een van de meest alledaagse en expressieve Spaanse woorden — je gebruikt het voor alles van pizza eten tot reizen.',uitspraak:'GAH-nas',voorbeelden:[{es:'Tengo muchas ganas de verte.',nl:'Ik heb er zoveel zin in om je te zien.'},{es:'Hoy no tengo ganas de nada.',nl:'Vandaag heb ik nergens zin in.'}]},
    {woord:'floreciente',woordsoort:'bijvoeglijk naamwoord',vertaling:'bloeiend / in bloei',uitleg:'Letterlijk "bloeiend" — maar ook figuurlijk voor een persoon, relatie of situatie die in opbloei is. Positief en vol potentieel.',uitspraak:'flo-reh-THYEN-teh',voorbeelden:[{es:'Tiene una vida floreciente.',nl:'Ze heeft een bloeiend leven.'},{es:'Un negocio floreciente.',nl:'Een bloeiend bedrijf.'}]},
    {woord:'hazaña',woordsoort:'zelfstandig naamwoord (v)',vertaling:'heldendaad / prestatie / krachttoer',uitleg:'Een hazaña is iets bijzonders dat iemand heeft bereikt — groot of klein. Het heeft iets heldachtigs, bewonderenswaardigs.',uitspraak:'ah-THA-nyah',voorbeelden:[{es:'Terminar el maratón fue una hazaña.',nl:'De marathon afmaken was een heldendaad.'},{es:'¡Qué hazaña!',nl:'Wat een prestatie!'}]},
    {woord:'vivamente',woordsoort:'bijwoord',vertaling:'levendig / vurig / hartelijk',uitleg:'Vivamente versterkt een gevoel of reactie. Je kan iets vivamente wensen, bedanken of aanbevelen — altijd met gevoel.',uitspraak:'vee-vah-MEN-teh',voorbeelden:[{es:'Lo deseo vivamente.',nl:'Ik wens het vurig.'},{es:'Te lo recomiendo vivamente.',nl:'Ik beveel het je hartelijk aan.'}]},
    {woord:'picardía',woordsoort:'zelfstandig naamwoord (v)',vertaling:'kattenkwaad / schalkse humor / sluwheid',uitleg:'Picardía is de vrolijke sluwheid — grappig zijn op een licht ondeugend manier. Iemand met picardía weet hoe het moet zonder het te ver te drijven.',uitspraak:'pee-kar-DEE-ah',voorbeelden:[{es:'Sus ojos brillan con picardía.',nl:'Haar ogen schitteren van schalkse humor.'},{es:'Lo dijo con picardía.',nl:'Ze zei het met een glimlach vol ondeugende sluwheid.'}]},
    {woord:'orgullo',woordsoort:'zelfstandig naamwoord (m)',vertaling:'trots',uitleg:'Orgullo is de trots die je voelt voor jezelf of iemand die je lief hebt. In het Spaans is trots een positieve, warme emotie — geen arrogantie.',uitspraak:'or-GOO-yo',voorbeelden:[{es:'Siento orgullo de ti.',nl:'Ik ben trots op je.'},{es:'Es un orgullo verte crecer.',nl:'Het is een trots om je te zien opgroeien.'}]},
    {woord:'cheer',woordsoort:'interjectie (leenwoord)',vertaling:'aanmoediging / vrolijkheid',uitleg:'In Spanje wordt ¡Chin chin! gebruikt voor proost, maar ¡Ánimo! voor aanmoediging. Cheer als concept leeft in woorden als ánimo, alegría en salero.',uitspraak:'CHEER (als leenwoord)',voorbeelden:[{es:'¡Ánimo y alegría!',nl:'Moed en vrolijkheid!'},{es:'Brindaron con alegría.',nl:'Ze proostten vrolijk.'}]},
    {woord:'encantador',woordsoort:'bijvoeglijk naamwoord',vertaling:'charmant / betoverend / lieftallig',uitleg:'Encantador betekent letterlijk "betoverend". Je gebruikt het voor mensen die je meteen voor zich winnen met hun charme en vriendelijkheid.',uitspraak:'en-kan-tah-DOR',voorbeelden:[{es:'Es un hombre encantador.',nl:'Hij is een charmante man.'},{es:'Tiene una sonrisa encantadora.',nl:'Ze heeft een betoverende glimlach.'}]},
    {woord:'bienvenido',woordsoort:'bijvoeglijk naamwoord / uitroep',vertaling:'welkom',uitleg:'Bienvenido is letterlijk "goed gekomen" — een hartelijk welkom. Warm en direct, zonder poespas. Het wordt ook figuurlijk gebruikt: bienvenida la primavera.',uitspraak:'byen-veh-NEE-do',voorbeelden:[{es:'¡Bienvenida a casa!',nl:'Welkom thuis!'},{es:'Bienvenido sea el cambio.',nl:'Welkom zij de verandering.'}]},
    {woord:'prosperidad',woordsoort:'zelfstandig naamwoord (v)',vertaling:'welvaart / voorspoed',uitleg:'Prosperidad gaat over bloeien in brede zin — niet alleen geld, maar ook gezondheid, relaties en geluk. Te wensen op belangrijke momenten.',uitspraak:'pros-peh-ree-DAD',voorbeelden:[{es:'Te deseo mucha prosperidad.',nl:'Ik wens je veel voorspoed.'},{es:'Un año de prosperidad.',nl:'Een jaar van welvaart.'}]},
    {woord:'despierto',woordsoort:'bijvoeglijk naamwoord',vertaling:'wakker / alert / scherpzinnig',uitleg:'Despierto betekent letterlijk "wakker", maar figuurlijk: mentaal alert en levendig. Iemand die despierto is mist niets.',uitspraak:'des-PYER-to',voorbeelden:[{es:'Es muy despierta para su edad.',nl:'Ze is erg scherpzinnig voor haar leeftijd.'},{es:'Tiene una mente muy despierta.',nl:'Ze heeft een heel wakker verstand.'}]},
    {woord:'triunfar',woordsoort:'werkwoord',vertaling:'triomferen / slagen',uitleg:'Triunfar is de overwinning behalen — in sport, liefde, werk of leven. Spanjaarden gebruiken het ook voor kleine successen: triunfé con la receta.',uitspraak:'tryon-FAR',voorbeelden:[{es:'¡Vas a triunfar!',nl:'Je gaat het redden!'},{es:'Triunfó en su primer concierto.',nl:'Ze triomfeerde bij haar eerste concert.'}]},
    {woord:'carcajada',woordsoort:'zelfstandig naamwoord (v)',vertaling:'schaterlach',uitleg:'Een carcajada is geen gewone lach maar een diepe, luid schallende lach die vanzelf komt. Reírse a carcajadas = schateren van het lachen.',uitspraak:'kar-ka-HAH-dah',voorbeelden:[{es:'Soltó una carcajada enorme.',nl:'Ze barstte uit in een enorme schaterlach.'},{es:'Nos reímos a carcajadas.',nl:'We schaaterden van het lachen.'}]},
    {woord:'rebosante',woordsoort:'bijvoeglijk naamwoord',vertaling:'overvloeiend van / boordevol',uitleg:'Rebosante de algo betekent zo vol van iets dat het overloopt. Rebosante de energía, de alegría, de amor — altijd met enthousiasme.',uitspraak:'reh-bo-SAN-teh',voorbeelden:[{es:'Está rebosante de alegría.',nl:'Ze loopt over van vreugde.'},{es:'Una copa rebosante de vino.',nl:'Een glas vol tot aan de rand met wijn.'}]},
    {woord:'afable',woordsoort:'bijvoeglijk naamwoord',vertaling:'vriendelijk / innemend / aangenaam in omgang',uitleg:'Afable beschrijft iemand die makkelijk in de omgang is, altijd vriendelijk en prettig. Geen opvallende uitstraling, maar altijd fijn om bij te zijn.',uitspraak:'ah-FAH-bleh',voorbeelden:[{es:'Es una persona muy afable.',nl:'Ze is erg vriendelijk en innemend.'},{es:'Un tono de voz afable.',nl:'Een aangename toon van stem.'}]},
    {woord:'querido',woordsoort:'bijvoeglijk naamwoord',vertaling:'geliefd / dierbaar',uitleg:'Querido is het Spaanse "dierbaar" — afgeleid van querer (houden van). Wordt gebruikt in brieven, gesprekken en als aanspreking voor iemand van wie je houdt.',uitspraak:'keh-REE-do',voorbeelden:[{es:'Mi querida amiga.',nl:'Mijn geliefde vriendin.'},{es:'Es muy querida por todos.',nl:'Ze is bij iedereen geliefd.'}]},
    {woord:'resolución',woordsoort:'zelfstandig naamwoord (v)',vertaling:'vastberadenheid / beslissing',uitleg:'Resolución is de kracht om een beslissing te nemen en erbij te blijven. Geen twijfel, geen halfslachtigheid — iemand met resolución weet wat ze wil.',uitspraak:'reh-so-loo-THYON',voorbeelden:[{es:'Actúa con resolución.',nl:'Ze handelt met vastberadenheid.'},{es:'Tomó la decisión con resolución.',nl:'Ze nam de beslissing resoluut.'}]},
    {woord:'jovial',woordsoort:'bijvoeglijk naamwoord',vertaling:'joviaal / vrolijk van aard',uitleg:'Jovial beschrijft iemand die van nature vrolijk, open en aangenaam gezelschap is. Het is een stabiele eigenschap, geen tijdelijke stemming.',uitspraak:'ho-BYAL',voorbeelden:[{es:'Tiene un carácter jovial.',nl:'Ze heeft een joviaal karakter.'},{es:'Su actitud jovial anima a todos.',nl:'Haar vrolijke houding brengt iedereen op.'}]},
    {woord:'esperanza',woordsoort:'zelfstandig naamwoord (v)',vertaling:'hoop',uitleg:'Esperanza is hoop — maar ook een naam. In de Spaanse cultuur is hoop een actief gevoel, niet passief afwachten. También is it the name of thousands of Spanish women.',uitspraak:'es-peh-RAN-tha',voorbeelden:[{es:'La esperanza es lo último que se pierde.',nl:'Hoop is het laatste dat je verliest.'},{es:'Tengo esperanza en el futuro.',nl:'Ik heb hoop voor de toekomst.'}]},
    {woord:'alentar',woordsoort:'werkwoord',vertaling:'aanmoedigen / aanvuren / inspireren',uitleg:'Alentar is iemand moed inspreken of aanmoedigen. Meer dan bemoedigen — het is hun vuur aanwakkeren.',uitspraak:'ah-len-TAR',voorbeelden:[{es:'Sus palabras me alentaron mucho.',nl:'Haar woorden moedigden me enorm aan.'},{es:'Alentar a alguien es un regalo.',nl:'Iemand aanmoedigen is een cadeau.'}]},
  ],
  1: [ // Melancholy — nostalgie, gemis, vergankelijkheid, stille schoonheid
    {woord:'morriña',woordsoort:'zelfstandig naamwoord (v)',vertaling:'heimwee (Galicisch)',uitleg:'Morriña komt uit het Galicisch en beschrijft een diep verlangen naar huis, naar mensen, naar een plek die er niet meer is. Niet vertaalbaar — het zit ergens tussen heimwee en rouw.',uitspraak:'mo-REEN-yah',voorbeelden:[{es:'Siento mucha morriña de mi ciudad.',nl:'Ik verlang diep naar mijn stad.'},{es:'La morriña me acompaña cuando estoy lejos.',nl:'Heimwee vergezelt me als ik ver weg ben.'}]},
    {woord:'nostalgia',woordsoort:'zelfstandig naamwoord (v)',vertaling:'nostalgie',uitleg:'Het bitterzoete verlangen naar het verleden. In het Spaans draagt nostalgia echte zwaarheid — niet vaag, maar gevoeld. Je ervaart het als een echo van iets moois dat voorbij is.',uitspraak:'nos-TAL-hya',voorbeelden:[{es:'Me invade la nostalgia.',nl:'Nostalgie overspoelt me.'},{es:'Una canción llena de nostalgia.',nl:'Een lied vol nostalgie.'}]},
    {woord:'añoranza',woordsoort:'zelfstandig naamwoord (v)',vertaling:'verlangen / gemis',uitleg:'Añoranza is het zachte, aanhoudende verlangen naar iets of iemand die er niet meer is. Zachter dan pijn, zwaarder dan "missen" — het blijft rustig bij je zitten.',uitspraak:'ah-nyo-RAN-tha',voorbeelden:[{es:'Siento añoranza de aquellos tiempos.',nl:'Ik verlang naar die tijden.'},{es:'La añoranza se mezcla con recuerdos.',nl:'Verlangen mengt zich met herinneringen.'}]},
    {woord:'efímero',woordsoort:'bijvoeglijk naamwoord',vertaling:'vluchtig / vergankelijk',uitleg:'Efímero beschrijft wat mooi is juist omdat het niet blijft. Een vluchtig moment, een bloem die verwelkt, een zomers geluid. In de Spaanse poëzie centraal.',uitspraak:'eh-FEE-meh-ro',voorbeelden:[{es:'La belleza es efímera.',nl:'Schoonheid is vluchtig.'},{es:'Un amor efímero pero intenso.',nl:'Een vluchtige maar intense liefde.'}]},
    {woord:'melancolía',woordsoort:'zelfstandig naamwoord (v)',vertaling:'melancholie',uitleg:'Melancolía is een diepe, stille droefheid die niet pijnlijk hoeft te zijn. Denk aan een regenachtige middag, een oude foto, een lied dat je deed denken aan vroeger.',uitspraak:'meh-lan-co-LEE-ah',voorbeelden:[{es:'Una melodía cargada de melancolía.',nl:'Een melodie doordrénkt van melancholie.'},{es:'La melancolía tiene su propia belleza.',nl:'Melancholie heeft haar eigen schoonheid.'}]},
    {woord:'soledad',woordsoort:'zelfstandig naamwoord (v)',vertaling:'eenzaamheid / stilte / alleen-zijn',uitleg:'Soledad kan gekozen stilte zijn (mooi) of opgelegde eenzaamheid (zwaar). In het Spaans maakt de context het verschil. También een vrouwennaam.',uitspraak:'so-leh-DAD',voorbeelden:[{es:'Disfruto de la soledad a veces.',nl:'Soms geniet ik van het alleen-zijn.'},{es:'La soledad pesa cuando no la eliges.',nl:'Eenzaamheid drukt als je er niet voor kiest.'}]},
    {woord:'suspirar',woordsoort:'werkwoord',vertaling:'zuchten',uitleg:'Suspirar is zuchten — maar in de Spaanse literatuur is een suspiro het zuchten van verlangen, liefde, van dingen die onuitgesproken blijven.',uitspraak:'soos-pee-RAR',voorbeelden:[{es:'Suspiró al leer la carta.',nl:'Ze zuchtte terwijl ze de brief las.'},{es:'Solo puedo suspirar.',nl:'Ik kan alleen maar zuchten.'}]},
    {woord:'agridulce',woordsoort:'bijvoeglijk naamwoord',vertaling:'bitterzoet',uitleg:'Letterlijk "zuurzoet" (agrio = zuur, dulce = zoet). Agridulce beschrijft gevoelens of momenten die tegelijk pijn doen en mooi zijn — afscheid, herinnering, nostalgie.',uitspraak:'ah-gree-DOOL-theh',voorbeelden:[{es:'Un recuerdo agridulce.',nl:'Een bitterzoete herinnering.'},{es:'La despedida fue agridulce.',nl:'Het afscheid was bitterzoet.'}]},
    {woord:'reminiscencia',woordsoort:'zelfstandig naamwoord (v)',vertaling:'herinnering / reminiscentie',uitleg:'Een reminiscencia is een fragment van het verleden dat spontaan opduikt — een geur, een melodie, een oud gevoel. Mooier dan gewone herinnering.',uitspraak:'reh-mee-nees-THEN-thya',voorbeelden:[{es:'Una reminiscencia de infancia.',nl:'Een herinnering aan de kindertijd.'},{es:'La canción evocó reminiscencias.',nl:'Het lied riep reminiscenties op.'}]},
    {woord:'lamento',woordsoort:'zelfstandig naamwoord (m)',vertaling:'klacht / rouwkreet / lamentatie',uitleg:'Een lamento is een uiting van verdriet of verlies — in muziek, poëzie of gewone spraak. Expressiever dan een zucht, minder dan een schreeuw.',uitspraak:'lah-MEN-to',voorbeelden:[{es:'Un lamento profundo.',nl:'Een diepe klacht.'},{es:'El flamenco está lleno de lamentos.',nl:'De flamenco zit vol lamentaties.'}]},
    {woord:'penumbra',woordsoort:'zelfstandig naamwoord (v)',vertaling:'schemerduister / halfduister',uitleg:'Penumbra is het halfduister — niet helemaal donker, niet helemaal licht. Vaak gebruikt als metafoor voor een gemoedstoestand die tussen hoop en verdriet in hangt.',uitspraak:'peh-NOOM-brah',voorbeelden:[{es:'La habitación estaba en penumbra.',nl:'De kamer was gehuld in schemerduister.'},{es:'Vivía en la penumbra de sus recuerdos.',nl:'Ze leefde in het halfduister van haar herinneringen.'}]},
    {woord:'transitorio',woordsoort:'bijvoeglijk naamwoord',vertaling:'tijdelijk / vergankelijk / voorbijgaand',uitleg:'Wat transitorio is, duurt niet. Alles is transitorio — vreugde, verdriet, momenten. Dit besef is zowel troostend als melancholisch.',uitspraak:'tran-see-TO-ryo',voorbeelden:[{es:'La tristeza es transitoria.',nl:'Verdriet is tijdelijk.'},{es:'Los momentos más bellos son transitorios.',nl:'De mooiste momenten zijn voorbijgaand.'}]},
    {woord:'añejo',woordsoort:'bijvoeglijk naamwoord',vertaling:'oud / belegen / uit een vroegere tijd',uitleg:'Añejo beschrijft iets dat de tijd heeft overleefd en daardoor waardevoller is geworden — wijn, kaas, herinneringen. Niet negatief oud, maar rijp.',uitspraak:'ah-NYEH-ho',voorbeelden:[{es:'Un vino añejo.',nl:'Een belegen wijn.'},{es:'Recuerdos añejos de la infancia.',nl:'Oude herinneringen aan de kindertijd.'}]},
    {woord:'recóndito',woordsoort:'bijvoeglijk naamwoord',vertaling:'verborgen / diep weggestopt',uitleg:'Recóndito beschrijft wat diep verstopt is — een plek, een herinnering, een gevoel. Lo más recóndito del alma = het diepste van de ziel.',uitspraak:'reh-KON-dee-to',voorbeelden:[{es:'En lo más recóndito de su corazón.',nl:'In het diepste van haar hart.'},{es:'Un lugar recóndito y olvidado.',nl:'Een verborgen en vergeten plek.'}]},
    {woord:'marchitar',woordsoort:'werkwoord',vertaling:'verwelken / doen verdorren',uitleg:'Marchitar is verwelken — voor bloemen maar ook voor dromen, schoonheid, relaties. Las flores se marchitan heeft iets onontkoombaars en moois.',uitspraak:'mar-chee-TAR',voorbeelden:[{es:'Las flores se marchitan pronto.',nl:'De bloemen verwelken snel.'},{es:'El tiempo marchita la juventud.',nl:'De tijd doet de jeugd verwelken.'}]},
    {woord:'crepúsculo',woordsoort:'zelfstandig naamwoord (m)',vertaling:'schemering / avondrood',uitleg:'Crepúsculo is de schemering — het moment tussen dag en nacht. In Spaanse poëzie symbool voor vergankelijkheid, het einde van iets moois.',uitspraak:'kreh-POOS-koo-lo',voorbeelden:[{es:'El crepúsculo tiñó el cielo de naranja.',nl:'De schemering kleurde de hemel oranje.'},{es:'Una melancolía de crepúsculo.',nl:'Een schemerende melancholie.'}]},
    {woord:'desvanecerse',woordsoort:'werkwoord (reflexief)',vertaling:'vervagen / verdwijnen / wegdriften',uitleg:'Desvanecerse is langzaam verdwijnen — zoals een droom bij het ontwaken, of een herinnering die vervaagt. Een prachtig en triest werkwoord.',uitspraak:'des-vah-neh-THER-seh',voorbeelden:[{es:'El recuerdo se fue desvaneciendo.',nl:'De herinnering begon te vervagen.'},{es:'Se desvanece como el humo.',nl:'Het vervluchtigt als rook.'}]},
    {woord:'otoñal',woordsoort:'bijvoeglijk naamwoord',vertaling:'herfstachtig / herfstig',uitleg:'Otoñal beschrijft de sfeer van de herfst — warm maar vervaagd, kleurrijk maar afscheid nemend. Vaak metafoor voor een leven in zijn tweede helft.',uitspraak:'o-to-NYAL',voorbeelden:[{es:'Una tarde otoñal y melancólica.',nl:'Een herfstachtige, melancholische middag.'},{es:'Tiene una belleza otoñal.',nl:'Ze heeft een herfstachtige schoonheid.'}]},
    {woord:'espectro',woordsoort:'zelfstandig naamwoord (m)',vertaling:'spook / spectrum / schaduw',uitleg:'Espectro is letterlijk een geest of spectrum, maar figuurlijk een aanwezige afwezigheid — iets dat er niet meer is maar nog steeds voelbaar.',uitspraak:'es-PEK-tro',voorbeelden:[{es:'El espectro de su recuerdo permanece.',nl:'Het spook van haar herinnering blijft.'},{es:'Un espectro del pasado.',nl:'Een schaduw uit het verleden.'}]},
    {woord:'vacío',woordsoort:'zelfstandig naamwoord (m) / bijvoeglijk naamwoord',vertaling:'leegte / leeg',uitleg:'Vacío is de leegte — emotioneel, ruimtelijk, existentieel. Sentir un vacío is het gevoel dat er iets of iemand ontbreekt, en dat dat gemis een vorm heeft.',uitspraak:'vah-THEE-o',voorbeelden:[{es:'Siento un vacío sin ti.',nl:'Ik voel een leegte zonder jou.'},{es:'Una mirada vacía.',nl:'Een lege blik.'}]},
    {woord:'quimera',woordsoort:'zelfstandig naamwoord (v)',vertaling:'hersenschim / ijdele droom / onmogelijke wens',uitleg:'Een quimera is iets dat je najaagt maar nooit zult bereiken — een droom die mooi is juist omdat hij onbereikbaar is.',uitspraak:'kee-MEH-rah',voorbeelden:[{es:'Perseguir quimeras es también vivir.',nl:'Dromen najagen is ook leven.'},{es:'Ese amor era una quimera.',nl:'Die liefde was een hersenschim.'}]},
    {woord:'fugaz',woordsoort:'bijvoeglijk naamwoord',vertaling:'vluchtig / voorbijflitsend',uitleg:'Fugaz beschrijft wat snel voorbijgaat — een moment, een glimlach, een geluksgevoel. Mooi juist omdat het niet blijft.',uitspraak:'foo-GATH',voorbeelden:[{es:'Un momento fugaz pero eterno.',nl:'Een vluchtig maar eeuwig moment.'},{es:'Una sonrisa fugaz.',nl:'Een vluchtige glimlach.'}]},
    {woord:'desencanto',woordsoort:'zelfstandig naamwoord (m)',vertaling:'teleurstelling / ontnuchtering',uitleg:'Desencanto is het verdwijnen van de betovering — als de werkelijkheid niet overeenkomt met wat je hoopte. Zachter dan verraad, pijnlijker dan teleurstelling.',uitspraak:'des-en-KAN-to',voorbeelden:[{es:'El desencanto llegó pronto.',nl:'De ontnuchtering kwam snel.'},{es:'Un aire de desencanto.',nl:'Een sfeer van teleurstelling.'}]},
    {woord:'umbral',woordsoort:'zelfstandig naamwoord (m)',vertaling:'drempel / grens / beginpunt',uitleg:'Umbral is de drempel — tussen twee ruimtes, twee tijden, twee levens. Staan op een umbral is weten dat er iets eindigt en iets begint.',uitspraak:'oom-BRAL',voorbeelden:[{es:'En el umbral de una nueva etapa.',nl:'Op de drempel van een nieuwe fase.'},{es:'Se detuvo en el umbral de la puerta.',nl:'Ze bleef staan op de drempel van de deur.'}]},
    {woord:'melancólico',woordsoort:'bijvoeglijk naamwoord',vertaling:'melancholisch',uitleg:'Beschrijft een stemming, persoon of melodie die een stille droefheid draagt. Niet depressief — melancholisch heeft ook schoonheid in zich.',uitspraak:'meh-lan-CO-lee-co',voorbeelden:[{es:'Una canción muy melancólica.',nl:'Een heel melancholisch lied.'},{es:'Tenía una mirada melancólica.',nl:'Ze had een melancholische blik.'}]},
    {woord:'tenue',woordsoort:'bijvoeglijk naamwoord',vertaling:'fijn / zwak / nauwelijks voelbaar',uitleg:'Tenue beschrijft iets dat bijna niet voelbaar is — een licht, een geur, een gevoel. Niet afwezig, maar ook niet aanwezig — ergens tussenin.',uitspraak:'TEH-nweh',voorbeelden:[{es:'Una luz tenue al atardecer.',nl:'Een zwak licht bij zonsondergang.'},{es:'Un tenue aroma de flores.',nl:'Een nauwelijks voelbare bloemengeur.'}]},
    {woord:'desvanecer',woordsoort:'werkwoord',vertaling:'vervagen / doen verdwijnen',uitleg:'Desvanecer is het actieve verdwijnen — licht dat vervaagt, geluid dat wegsterft, een herinnering die je niet kunt vasthouden hoe hard je ook probeert.',uitspraak:'des-vah-neh-THER',voorbeelden:[{es:'El sol empezó a desvanecer.',nl:'De zon begon te vervagen.'},{es:'Todo lo bello tiende a desvanecer.',nl:'Alles moois neigt om te verdwijnen.'}]},
    {woord:'hondo',woordsoort:'bijvoeglijk naamwoord',vertaling:'diep / diepgaand',uitleg:'Hondo betekent diep — voor water maar ook voor gevoelens. Cante jondo is de diepe flamenco-zang, vol emotie en pijn. Hondo raakt de kern.',uitspraak:'ON-do',voorbeelden:[{es:'Un sentimiento muy hondo.',nl:'Een heel diep gevoel.'},{es:'El cante jondo llega al alma.',nl:'De diepe flamenco-zang raakt de ziel.'}]},
    {woord:'resquicio',woordsoort:'zelfstandig naamwoord (m)',vertaling:'kier / spleet / sprankje',uitleg:'Letterlijk een kier in een deur — maar ook figuurlijk: un resquicio de esperanza is een sprankje hoop in het donker. Klein maar essentieel.',uitspraak:'res-KEE-thyo',voorbeelden:[{es:'Un resquicio de luz en la oscuridad.',nl:'Een sprankje licht in het donker.'},{es:'Aún queda un resquicio de esperanza.',nl:'Er is nog een sprankje hoop.'}]},
    {woord:'lánguido',woordsoort:'bijvoeglijk naamwoord',vertaling:'lusteloos / mat / sloom',uitleg:'Lánguido beschrijft een staat van zwakheid, moeheid of traagheid — niet ziek, maar zonder energie of enthousiasme. Kan ook mooi zijn, als een lánguid gebaar.',uitspraak:'LAN-ghee-do',voorbeelden:[{es:'Una mirada lánguida.',nl:'Een lusteloze blik.'},{es:'El calor la dejó lánguida.',nl:'De hitte liet haar mat achter.'}]},
    {woord:'pasajero',woordsoort:'bijvoeglijk naamwoord',vertaling:'voorbijgaand / tijdelijk',uitleg:'Pasajero beschrijft wat niet blijft — een fase, een gevoel, een pijn. Weten dat iets pasajero is maakt het draagbaarder.',uitspraak:'pah-sah-HEH-ro',voorbeelden:[{es:'La tristeza es pasajera.',nl:'Verdriet is voorbijgaand.'},{es:'Un amor pasajero.',nl:'Een tijdelijke liefde.'}]},
    {woord:'gris',woordsoort:'bijvoeglijk naamwoord',vertaling:'grijs / saai / somber',uitleg:'Gris is letterlijk grijs, maar ook de kleur van een sombere stemming — un día gris, un humor gris. Niet zwart, niet wit — ergens tussenin.',uitspraak:'GREES',voorbeelden:[{es:'Un cielo gris y plomizo.',nl:'Een grijze, loodkleurige hemel.'},{es:'Tengo el ánimo gris hoy.',nl:'Ik voel me vandaag somber.'}]},
    {woord:'ceniciento',woordsoort:'bijvoeglijk naamwoord',vertaling:'asgrijs / grauw / bleek',uitleg:'De kleur van as — ceniciento beschrijft een tint of sfeer die alle glans heeft verloren. Grauw en mat, maar met een poëtische klank.',uitspraak:'theh-nee-THYEN-to',voorbeelden:[{es:'Un amanecer ceniciento.',nl:'Een asgrijze dageraad.'},{es:'Tenía un aspecto ceniciento.',nl:'Ze zag er grauw en bleek uit.'}]},
    {woord:'desolado',woordsoort:'bijvoeglijk naamwoord',vertaling:'troosteloos / verlaten / in diepe pijn',uitleg:'Desolado is de toestand van complete verlatenheid — van een plek of een persoon. Troosteloos en leeg, maar met een indrukwekkend soort waardigheid.',uitspraak:'deh-so-LAH-do',voorbeelden:[{es:'Se sentía desolada tras la pérdida.',nl:'Ze voelde zich troosteloos na het verlies.'},{es:'Un paisaje desolado y hermoso.',nl:'Een troosteloos en mooi landschap.'}]},
    {woord:'añorar',woordsoort:'werkwoord',vertaling:'missen / verlangen naar',uitleg:'Añorar is het werkwoord van añoranza — actief verlangen naar iets of iemand die er niet is. Zachter dan rouwen, meer dan gewoon missen.',uitspraak:'ah-nyo-RAR',voorbeelden:[{es:'Añoro aquellos tiempos.',nl:'Ik verlang naar die tijden.'},{es:'Añoro tu presencia.',nl:'Ik mis jouw aanwezigheid.'}]},
    {woord:'espina',woordsoort:'zelfstandig naamwoord (v)',vertaling:'doorn / stekel / kwelling',uitleg:'Espina is letterlijk een doorn, maar ook een emotionele stekende pijn. Tener una espina clavada = een wond die maar niet geneest.',uitspraak:'es-PEE-nah',voorbeelden:[{es:'Tiene una espina clavada.',nl:'Ze draagt een kwelling in zich.'},{es:'Las rosas tienen espinas.',nl:'Rozen hebben doornen.'}]},
    {woord:'saudade',woordsoort:'zelfstandig naamwoord (v) (leenwoord)',vertaling:'saudade — diep verlangen zonder naam',uitleg:'Portugees leenwoord dat in het Spaans is opgenomen. Beschrijft het diepste gevoel van gemis — iets dat je mist maar misschien nooit hebt gehad. Onvertaalbaar en meest gebruikt in muziek.',uitspraak:'saw-DAH-deh',voorbeelden:[{es:'Una canción llena de saudade.',nl:'Een lied vol onuitsprekelijk verlangen.'},{es:'Siento saudade de algo que nunca tuve.',nl:'Ik verlang naar iets dat ik nooit had.'}]},
    {woord:'quebranto',woordsoort:'zelfstandig naamwoord (m)',vertaling:'verdriet / gebrokenheid',uitleg:'Quebranto is het diepe verdriet dat iemand breekt — niet gewoon triest, maar echt gebroken van binnen. Komt van quebrar (breken).',uitspraak:'keh-BRAN-to',voorbeelden:[{es:'Sufrió un quebranto enorme.',nl:'Ze leed een enorme gebrokenheid.'},{es:'Su quebranto era evidente.',nl:'Haar verdriet was zichtbaar.'}]},
    {woord:'íntimo',woordsoort:'bijvoeglijk naamwoord',vertaling:'intiem / diepgevoeld / persoonlijk',uitleg:'Íntimo beschrijft wat dicht bij het hart zit — niet voor buitenstaanders. Een íntimo verdriet, een íntima vreugde. Dingen die je niet zomaar deelt.',uitspraak:'EEN-tee-mo',voorbeelden:[{es:'Un dolor muy íntimo.',nl:'Een heel persoonlijk verdriet.'},{es:'Una conversación íntima.',nl:'Een intiem gesprek.'}]},
    {woord:'hondo',woordsoort:'bijvoeglijk naamwoord',vertaling:'diep (van gevoel)',uitleg:'Hondo is de diepte die je voelt maar niet kunt zien. Wordt veel gebruikt in flamenco en poëzie om intensiteit van emotie te beschrijven.',uitspraak:'ON-do',voorbeelden:[{es:'Un sentimiento muy hondo.',nl:'Een diep gevoel.'},{es:'El cante jondo llega al alma.',nl:'De diepe zang raakt de ziel.'}]},
    {woord:'sombra',woordsoort:'zelfstandig naamwoord (v)',vertaling:'schaduw',uitleg:'Sombra is schaduw — letterlijk en figuurlijk. Een sombra op iemands gezicht is een wolk van verdriet. Vivir en la sombra is leven in de marge, uit het licht.',uitspraak:'SOM-brah',voorbeelden:[{es:'Había una sombra de tristeza en su mirada.',nl:'Er lag een schaduw van verdriet in haar blik.'},{es:'La sombra cae al atardecer.',nl:'De schaduw valt bij zonsondergang.'}]},
    {woord:'desvelo',woordsoort:'zelfstandig naamwoord (m)',vertaling:'slapeloosheid / zorg / innerlijke onrust',uitleg:'Desvelo is letterlijk niet kunnen slapen — maar ook de innerlijke onrust of bezorgdheid die je wakker houdt. Tus desvelos son mis desvelos = jouw zorgen zijn mijn zorgen.',uitspraak:'des-VEH-lo',voorbeelden:[{es:'Las noches de desvelo son largas.',nl:'Slapeloze nachten zijn lang.'},{es:'Ese proyecto era su mayor desvelo.',nl:'Dat project was haar grootste zorg.'}]},
    {woord:'ausencia',woordsoort:'zelfstandig naamwoord (v)',vertaling:'afwezigheid / gemis',uitleg:'Ausencia is meer dan niet aanwezig zijn — het is de zichtbare leegte die iemand achterlaat. La ausencia de alguien querido pesa.',uitspraak:'ow-SEN-thya',voorbeelden:[{es:'Su ausencia se nota en todo.',nl:'Haar afwezigheid is overal voelbaar.'},{es:'La ausencia hace añorar.',nl:'Afwezigheid doet verlangen.'}]},
    {woord:'ocaso',woordsoort:'zelfstandig naamwoord (m)',vertaling:'zonsondergang / ondergang / einde',uitleg:'Ocaso is de zonsondergang — maar ook het einde van een tijdperk, een leven of een relatie. Melancholisch en prachtig tegelijk.',uitspraak:'o-KAH-so',voorbeelden:[{es:'El ocaso tiñó el mar de rojo.',nl:'De zonsondergang kleurde de zee rood.'},{es:'El ocaso de una era.',nl:'Het einde van een tijdperk.'}]},
    {woord:'duelo',woordsoort:'zelfstandig naamwoord (m)',vertaling:'rouw / duel / verdriet',uitleg:'Duelo is rouw — de periode na verlies. Maar ook een duel (twee betekenissen!). In emotionele context is duelo het doorleven van verdriet.',uitspraak:'DWEH-lo',voorbeelden:[{es:'Está en duelo por la pérdida.',nl:'Ze is in rouw na het verlies.'},{es:'El duelo tarda en sanar.',nl:'Rouw heeft tijd om te helen.'}]},
    {woord:'fragilidad',woordsoort:'zelfstandig naamwoord (v)',vertaling:'kwetsbaarheid / breekbaarheid',uitleg:'Fragilidad is de breekbaarheid van mooie dingen — en ook van mensen. In de Spaanse literatuur wordt fragilidad gezien als een vorm van menselijkheid, niet als zwakheid.',uitspraak:'frah-hee-lee-DAD',voorbeelden:[{es:'La fragilidad de los recuerdos.',nl:'De breekbaarheid van herinneringen.'},{es:'Su fragilidad me conmueve.',nl:'Haar kwetsbaarheid raakt me.'}]},
    {woord:'madrugada',woordsoort:'zelfstandig naamwoord (v)',vertaling:'de vroege ochtenduren / de nacht',uitleg:'Madrugada zijn de uren tussen middernacht en dageraad — een typisch Spaans woord voor de meest intieme en eenzame uren van de dag.',uitspraak:'mah-droo-GAH-dah',voorbeelden:[{es:'Lloró en la madrugada.',nl:'Ze huilde in de vroege ochtenduren.'},{es:'La madrugada es larga cuando no puedes dormir.',nl:'De nacht is lang als je niet kunt slapen.'}]},
    {woord:'ceniza',woordsoort:'zelfstandig naamwoord (v)',vertaling:'as / rest van iets dat verbrand is',uitleg:'Ceniza is de as die overblijft — van een vuur, van een liefde, van een droom. Reducir a cenizas = tot as reduceren. Symbool voor definitief einde.',uitspraak:'theh-NEE-thah',voorbeelden:[{es:'Todo se redujo a cenizas.',nl:'Alles werd tot as gereduceerd.'},{es:'Las cenizas de un amor pasado.',nl:'De as van een vroegere liefde.'}]},
    {woord:'etéreo',woordsoort:'bijvoeglijk naamwoord',vertaling:'etherisch / ongrijpbaar / hemels',uitleg:'Etéreo beschrijft iets dat zo licht en ongrijpbaar is dat het bijna niet van deze wereld lijkt. Mooie muziek, een herinnering, iemands manier van bewegen.',uitspraak:'eh-TEH-reh-o',voorbeelden:[{es:'Una belleza etérea.',nl:'Een etherische schoonheid.'},{es:'El recuerdo es etéreo.',nl:'De herinnering is ongrijpbaar.'}]},
  ],
  2: [ // Chill — rust, kalmte, stilte, ontspanning
    {woord:'tranquilo',woordsoort:'bijvoeglijk naamwoord',vertaling:'rustig / kalm',uitleg:'Tranquilo beschrijft rust — van een plek, een persoon of een moment. Ook gebruikt als geruststelling: ¡Tranquilo! = geen zorgen. Een van de fijnste Spaanse woorden.',uitspraak:'tran-KEE-lo',voorbeelden:[{es:'El pueblo es muy tranquilo.',nl:'Het dorp is heel rustig.'},{es:'¡Tranquila, todo está bien!',nl:'Geen zorgen, alles is goed!'}]},
    {woord:'sobremesa',woordsoort:'zelfstandig naamwoord (v)',vertaling:'natafelen',uitleg:'De tijd die je aan tafel doorbrengt na het eten, pratend en genietend. Een van Spanje\'s meest geliefde tradities — geen haast, geen telefoon, gewoon zijn.',uitspraak:'so-breh-MEH-sah',voorbeelden:[{es:'La sobremesa duró dos horas.',nl:'Het natafelen duurde twee uur.'},{es:'Me encanta la sobremesa del domingo.',nl:'Ik hou van het natafelen op zondag.'}]},
    {woord:'remanso',woordsoort:'zelfstandig naamwoord (m)',vertaling:'rustige plek / oase van stilte',uitleg:'Letterlijk een rustig water in een rivier — figuurlijk een plek of moment van vrede te midden van chaos. Je eigen remanso vinden is essentieel.',uitspraak:'reh-MAN-so',voorbeelden:[{es:'Este café es un remanso de paz.',nl:'Dit café is een oase van rust.'},{es:'Encontré mi remanso en el parque.',nl:'Ik vond mijn rustplek in het park.'}]},
    {woord:'apacible',woordsoort:'bijvoeglijk naamwoord',vertaling:'vredig / zacht / rustig',uitleg:'Apacible beschrijft een dag, persoon of sfeer die niets van je eist. Zacht en aangenaam, zonder spanning. Een apacible middag is perfect niets doen.',uitspraak:'ah-pah-THEE-bleh',voorbeelden:[{es:'Una tarde apacible de verano.',nl:'Een vredig zomermiddag.'},{es:'Tiene un carácter muy apacible.',nl:'Ze heeft een heel vredig karakter.'}]},
    {woord:'holgazán',woordsoort:'bijvoeglijk naamwoord / zelfstandig naamwoord',vertaling:'luiaard / lui',uitleg:'Lui — maar gezegd met genegenheid op een zondag is het bijna een compliment. Holgazán zijn op de juiste dag is een levenskunst.',uitspraak:'ol-gah-THAN',voorbeelden:[{es:'Hoy me siento un poco holgazán.',nl:'Vandaag voel ik me een beetje lui.'},{es:'No seas holgazán todo el día.',nl:'Wees niet de hele dag een luiaard.'}]},
    {woord:'pausado',woordsoort:'bijvoeglijk naamwoord',vertaling:'bedaard / weloverwogen / rustig van tempo',uitleg:'Pausado beschrijft iemand of iets dat zijn eigen tempo aanhoudt — niet langzaam, maar bewust. Praten op een pausado manier is met rust en bedachtzaamheid.',uitspraak:'pow-SAH-do',voorbeelden:[{es:'Habla de forma pausada.',nl:'Ze spreekt op een bedaarde manier.'},{es:'Llevamos un ritmo pausado.',nl:'We houden een rustig tempo aan.'}]},
    {woord:'sereno',woordsoort:'bijvoeglijk naamwoord',vertaling:'sereen / helder / kalm',uitleg:'Sereno is de rust van een heldere nacht — absoluut en stil. In een persoon is serenidad een diepe, onverstoorde kalmte.',uitspraak:'seh-REH-no',voorbeelden:[{es:'Un lago sereno al amanecer.',nl:'Een sereen meer bij zonsopgang.'},{es:'Tiene una actitud muy serena.',nl:'Ze heeft een heel serene houding.'}]},
    {woord:'quietud',woordsoort:'zelfstandig naamwoord (v)',vertaling:'stilte / rust / roerloosheid',uitleg:'Quietud is de absolute stilte — van een plek of van binnen. Niet verveling, maar een volledige rust die alle lawaai uitsluit.',uitspraak:'kyeh-TOOD',voorbeelden:[{es:'La quietud del campo me calma.',nl:'De stilte van het platteland kalmeert me.'},{es:'Buscaba la quietud interior.',nl:'Ze zocht innerlijke rust.'}]},
    {woord:'lento',woordsoort:'bijvoeglijk naamwoord / bijwoord',vertaling:'langzaam / rustig van tempo',uitleg:'Lento is langzaam — en dat is prima. Ir lento no es ir mal. Langzaam gaan betekent dingen kunnen zien die je anders mist.',uitspraak:'LEN-to',voorbeelden:[{es:'Camina lento y disfruta.',nl:'Loop langzaam en geniet.'},{es:'Una melodía lenta y hermosa.',nl:'Een langzame, mooie melodie.'}]},
    {woord:'sencillo',woordsoort:'bijvoeglijk naamwoord',vertaling:'eenvoudig / simpel / ongecompliceerd',uitleg:'Sencillo is positief — iets dat eenvoudig en eerlijk is, zonder poespas. Ook een persoon die sencillo is is nuchter en toegankelijk.',uitspraak:'sen-THEE-yo',voorbeelden:[{es:'Una vida sencilla pero plena.',nl:'Een eenvoudig maar vervuld leven.'},{es:'Es una persona muy sencilla.',nl:'Ze is een heel ongecompliceerd persoon.'}]},
    {woord:'acoger',woordsoort:'werkwoord',vertaling:'verwelkomen / opnemen / een thuis geven',uitleg:'Acoger is meer dan welkom heten — het is iemand opnemen in je ruimte of hart, ze laten voelen dat ze erbij horen.',uitspraak:'ah-co-HER',voorbeelden:[{es:'La ciudad me acogió muy bien.',nl:'De stad verwelkomde me warm.'},{es:'Nos acogieron como familia.',nl:'Ze ontvingen ons als familie.'}]},
    {woord:'paladejar',woordsoort:'werkwoord',vertaling:'proeven / langzaam genieten van',uitleg:'Paladejar is bewust en langzaam proeven — niet alleen van eten, maar van een moment, een gesprek, een gevoel. Neem de tijd om het te paladesjar.',uitspraak:'pah-lah-deh-HAR',voorbeelden:[{es:'Paladea cada sorbo de té.',nl:'Proef elk slokje thee langzaam.'},{es:'Hay que paladejar la vida.',nl:'Je moet het leven langzaam proeven.'}]},
    {woord:'reposo',woordsoort:'zelfstandig naamwoord (m)',vertaling:'rust / rustperiode',uitleg:'Reposo is de rust die je bewust neemt — meer dan slaap, meer dan stilzitten. Het lichaam en de geest laten herstellen is een kunst.',uitspraak:'reh-PO-so',voorbeelden:[{es:'Necesito un momento de reposo.',nl:'Ik heb even rust nodig.'},{es:'El reposo es necesario para el cuerpo.',nl:'Rust is noodzakelijk voor het lichaam.'}]},
    {woord:'contemplar',woordsoort:'werkwoord',vertaling:'beschouwen / aanschouwen / overwegen',uitleg:'Contemplar is rustig kijken naar iets — een landschap, een gedachte, een mogelijkheid. Zonder haast, gewoon aanwezig zijn bij wat er is.',uitspraak:'con-tem-PLAR',voorbeelden:[{es:'Contempló el mar en silencio.',nl:'Ze beschouwde de zee in stilte.'},{es:'Me gusta contemplar el horizonte.',nl:'Ik hou ervan het verre horizon te aanschouwen.'}]},
    {woord:'armonía',woordsoort:'zelfstandig naamwoord (v)',vertaling:'harmonie',uitleg:'Armonía is de harmonie van klanken, kleuren of mensen. Als alles op zijn plek is en niets wringt — dat is armonía. Fijn om na te streven.',uitspraak:'ar-mo-NEE-ah',voorbeelden:[{es:'Vivir en armonía con la naturaleza.',nl:'In harmonie met de natuur leven.'},{es:'Hay una armonía especial entre ellos.',nl:'Er is een bijzondere harmonie tussen hen.'}]},
    {woord:'parsimonia',woordsoort:'zelfstandig naamwoord (v)',vertaling:'kalmte / bedachtzaamheid / het doen zonder haast',uitleg:'Con parsimonia betekent rustig en doordacht, zonder te jagen. Iemand die con parsimonia werkt neemt de tijd voor elk ding.',uitspraak:'par-see-MO-nee-ah',voorbeelden:[{es:'Lo hizo todo con parsimonia.',nl:'Ze deed alles rustig en bedachtzaam.'},{es:'La parsimonia es una forma de respeto.',nl:'Kalmte is een vorm van respect.'}]},
    {woord:'recogimiento',woordsoort:'zelfstandig naamwoord (m)',vertaling:'inkeer / innerlijke rust / terugtrekking',uitleg:'Recogimiento is het naar binnen keren — bewust terugtrekken uit de drukte om bij jezelf te komen. Spiritueel en rustgevend.',uitspraak:'reh-co-hee-MYEN-to',voorbeelden:[{es:'Buscaba el recogimiento del convento.',nl:'Ze zocht de stilte van het klooster.'},{es:'Un momento de recogimiento interior.',nl:'Een moment van innerlijke inkeer.'}]},
    {woord:'cadencia',woordsoort:'zelfstandig naamwoord (v)',vertaling:'cadans / ritme / regelmatige gang',uitleg:'Cadencia is het ritme van iets — een lied, een wandeling, een gesprek. Een aangename cadencia is als een schommel die je meeneemt.',uitspraak:'kah-DEN-thya',voorbeelden:[{es:'Camina con una cadencia suave.',nl:'Ze loopt met een zachte cadans.'},{es:'La cadencia del mar me adormece.',nl:'Het ritme van de zee sust me in slaap.'}]},
    {woord:'silencio',woordsoort:'zelfstandig naamwoord (m)',vertaling:'stilte',uitleg:'Silencio is meer dan afwezigheid van geluid — het is aanwezigheid van rust. In Spanje zegt men: hay silencios que dicen más que las palabras.',uitspraak:'see-LEN-thyo',voorbeelden:[{es:'Un silencio cómodo y cálido.',nl:'Een comfortabele en warme stilte.'},{es:'El silencio también es una respuesta.',nl:'Stilte is ook een antwoord.'}]},
    {woord:'placidez',woordsoort:'zelfstandig naamwoord (v)',vertaling:'sereniteit / kalmte / rust',uitleg:'Placidez is de absolute kalmte — als er geen rimpels zijn op het water of in de geest. Een zeldzame en waardevolle toestand.',uitspraak:'plah-thee-DETH',voorbeelden:[{es:'La placidez del lago me tranquiliza.',nl:'De kalmte van het meer stelt me gerust.'},{es:'Vive con una placidez envidiable.',nl:'Ze leeft met een benijdenswaardige sereniteit.'}]},
    {woord:'cobijo',woordsoort:'zelfstandig naamwoord (m)',vertaling:'beschutting / schuilplaats / veiligheid',uitleg:'Cobijo is de beschutting die je zoekt als je moe bent van de wereld. Een plek, een persoon of een moment die je beschermt.',uitspraak:'co-BEE-ho',voorbeelden:[{es:'Encontró cobijo en su hogar.',nl:'Ze vond beschutting in haar thuis.'},{es:'Busco cobijo en la música.',nl:'Ik zoek beschutting in muziek.'}]},
    {woord:'reposado',woordsoort:'bijvoeglijk naamwoord',vertaling:'rustig / kalm / bedaard',uitleg:'Reposado beschrijft iemand of iets dat zijn energie heeft gevonden — niet moe, maar tot rust gekomen. Een reposado gesprek is langzaam en aangenaam.',uitspraak:'reh-po-SAH-do',voorbeelden:[{es:'Un vino reposado y elegante.',nl:'Een rustige, elegante wijn.'},{es:'Tiene un carácter reposado.',nl:'Ze heeft een bedaard karakter.'}]},
    {woord:'descanso',woordsoort:'zelfstandig naamwoord (m)',vertaling:'rust / pauze / rustpunt',uitleg:'Descanso is de pauze die je lichaam en geest nodig hebben. In Spanje is descanso heilig — de siësta bestaat niet voor niets.',uitspraak:'des-KAN-so',voorbeelden:[{es:'Me merezco un descanso.',nl:'Ik verdien een rust.'},{es:'El descanso es parte del trabajo.',nl:'Rust is onderdeel van het werk.'}]},
    {woord:'ameno',woordsoort:'bijvoeglijk naamwoord',vertaling:'aangenaam / prettig / gezellig',uitleg:'Ameno beschrijft een activiteit of plek die prettig en licht is — niets vermoeiends, gewoon fijn. Una velada amena = een aangename avond.',uitspraak:'ah-MEH-no',voorbeelden:[{es:'Una conversación muy amena.',nl:'Een heel aangenaam gesprek.'},{es:'Pasamos una tarde amena.',nl:'We brachten een prettige middag door.'}]},
    {woord:'relajado',woordsoort:'bijvoeglijk naamwoord',vertaling:'ontspannen / relaxed',uitleg:'Relajado is het Spaanse "relaxed" — ontspannen van lichaam en geest. Estar relajado is de toestand die je wil bereiken na een lange dag.',uitspraak:'reh-lah-HAH-do',voorbeelden:[{es:'Se le ve muy relajada.',nl:'Ze ziet er heel ontspannen uit.'},{es:'Un ambiente relajado y acogedor.',nl:'Een ontspannen en gastvrij sfeer.'}]},
    {woord:'suave',woordsoort:'bijvoeglijk naamwoord',vertaling:'zacht / mild / glad',uitleg:'Suave is de zachtheid — van stof, van muziek, van een stem, van een karakter. Niet zwak, maar aangenaam en teder.',uitspraak:'SWAH-veh',voorbeelden:[{es:'Una música suave y relajante.',nl:'Zachte, ontspannende muziek.'},{es:'Tiene una voz muy suave.',nl:'Ze heeft een heel zachte stem.'}]},
    {woord:'morosidad',woordsoort:'zelfstandig naamwoord (v)',vertaling:'traagheid / bewust vertragen',uitleg:'Morosidad (in positieve zin) is de bewuste traagheid — de kunst van niet haasten. Vergelijkbaar met het Italiaanse "dolce far niente".',uitspraak:'mo-ro-see-DAD',voorbeelden:[{es:'Con morosidad placentera.',nl:'Met aangename traagheid.'},{es:'La morosidad del domingo.',nl:'De traagheid van een zondag.'}]},
    {woord:'abrigo',woordsoort:'zelfstandig naamwoord (m)',vertaling:'warmte / beschutting / jas',uitleg:'Abrigo is letterlijk een jas, maar ook de warmte en bescherming van een thuis, een persoon of een dekentje. Al abrigo del hogar = in de warmte van thuis.',uitspraak:'ah-BREE-go',voorbeelden:[{es:'Al abrigo de la chimenea.',nl:'In de warmte van de open haard.'},{es:'Busco el abrigo de tu compañía.',nl:'Ik zoek de beschutting van jouw gezelschap.'}]},
    {woord:'plácido',woordsoort:'bijvoeglijk naamwoord',vertaling:'rustig / sereen / vriendelijk',uitleg:'Plácido beschrijft een absolute, onverstoorde rust. Een plácido meer heeft geen rimpelingen. Een plácida persoon heeft een serene kalmte.',uitspraak:'PLAH-thee-do',voorbeelden:[{es:'Un domingo plácido y sin prisa.',nl:'Een rustige zondag zonder haast.'},{es:'Un sueño plácido.',nl:'Een serene slaap.'}]},
    {woord:'ensoñación',woordsoort:'zelfstandig naamwoord (v)',vertaling:'dagdroom / mijmering',uitleg:'Ensoñación is de staat van dagdromen — ergens anders zijn met je gedachten, op een prettige manier. Niet afwezig, maar in je eigen wereld.',uitspraak:'en-son-ya-THYON',voorbeelden:[{es:'Perdida en una ensoñación.',nl:'Verloren in een dagdroom.'},{es:'Un estado de ensoñación placentera.',nl:'Een toestand van prettige mijmering.'}]},
    {woord:'ralentizar',woordsoort:'werkwoord',vertaling:'vertragen / afremmen',uitleg:'Ralentizar is bewust vertragen — het tempo terugschroeven om meer te zien en te voelen. De wereld gaat sneller als jij langzamer gaat.',uitspraak:'rah-len-tee-THAR',voorbeelden:[{es:'Hay que ralentizar el ritmo de vida.',nl:'Het tempo van het leven moet vertraagd worden.'},{es:'Ralentiza y disfruta.',nl:'Vertrag en geniet.'}]},
    {woord:'alivio',woordsoort:'zelfstandig naamwoord (m)',vertaling:'verlichting / opluchting',uitleg:'Alivio is het gevoel als een last van je schouders valt. Niet geluk, maar de afwezigheid van spanning — en dat is soms nog fijner.',uitspraak:'ah-LEE-vyo',voorbeelden:[{es:'¡Qué alivio!',nl:'Wat een opluchting!'},{es:'Siento un gran alivio.',nl:'Ik voel een grote verlichting.'}]},
    {woord:'fluir',woordsoort:'werkwoord',vertaling:'stromen / vloeien / in flow zijn',uitleg:'Fluir is stromen — water dat zijn weg vindt, maar ook een persoon die in flow is. Cuando todo fluye, nada cuesta. Als alles stroomt, kost niets moeite.',uitspraak:'floo-EER',voorbeelden:[{es:'Cuando todo fluye, es maravilloso.',nl:'Als alles stroomt, is het prachtig.'},{es:'La conversación fluyó con facilidad.',nl:'Het gesprek vloeide makkelijk.'}]},
    {woord:'calma',woordsoort:'zelfstandig naamwoord (v)',vertaling:'kalmte / rust',uitleg:'Calma is het simpelste woord voor rust. Con calma = rustig aan. Mantén la calma = blijf kalm. Een universeel Spaans advies.',uitspraak:'KAL-mah',voorbeelden:[{es:'Con calma todo se resuelve.',nl:'Met kalmte lost alles zich op.'},{es:'Hay una calma especial en el campo.',nl:'Er heerst een bijzondere rust op het platteland.'}]},
    {woord:'ocio',woordsoort:'zelfstandig naamwoord (m)',vertaling:'vrije tijd / ontspanning',uitleg:'Ocio is vrije tijd — maar in het Spaans heeft het een positieve waarde. Tiempo de ocio is niet de tijd dat je niets doet, maar de tijd die van jou is.',uitspraak:'O-thyo',voorbeelden:[{es:'El ocio también es necesario.',nl:'Vrije tijd is ook noodzakelijk.'},{es:'¿Qué haces en tu tiempo de ocio?',nl:'Wat doe je in je vrije tijd?'}]},
    {woord:'dicha',woordsoort:'zelfstandig naamwoord (v)',vertaling:'geluk / zaligheid / vreugde',uitleg:'Dicha is een diepe, stille vorm van geluk — niet uitbundig maar volmaakt. La dicha de las cosas simples = het geluk van eenvoudige dingen.',uitspraak:'DEE-chah',voorbeelden:[{es:'La dicha de estar en casa.',nl:'Het geluk van thuis zijn.'},{es:'Una sensación de dicha pura.',nl:'Een gevoel van zuivere zaligheid.'}]},
    {woord:'bienestar',woordsoort:'zelfstandig naamwoord (m)',vertaling:'welzijn / welbevinden / comfort',uitleg:'Bienestar is het gevoel dat het goed met je gaat — lichaam en geest in balans. Promover el bienestar is zorgen voor jezelf en anderen.',uitspraak:'byen-es-TAR',voorbeelden:[{es:'El bienestar es más que la salud.',nl:'Welzijn is meer dan gezondheid.'},{es:'Busco el bienestar en las pequeñas cosas.',nl:'Ik zoek welzijn in kleine dingen.'}]},
    {woord:'pereza',woordsoort:'zelfstandig naamwoord (v)',vertaling:'luiheid / traagheid',uitleg:'Pereza is luiheid — maar op de juiste dag is het heilig. Tener pereza op een zondag is geen zonde maar een levenskunst.',uitspraak:'peh-REH-tha',voorbeelden:[{es:'Hoy tengo una pereza enorme.',nl:'Vandaag heb ik enorme zin om lui te zijn.'},{es:'La pereza del domingo es sagrada.',nl:'De luiheid van zondag is heilig.'}]},
    {woord:'amanecer',woordsoort:'zelfstandig naamwoord (m) / werkwoord',vertaling:'dageraad / ochtendgloren / aanbreken van de dag',uitleg:'Amanecer is zowel het zelfstandig naamwoord (dageraad) als het werkwoord (dagbreken). Er is iets rustgevends aan de stilte van een nieuw begin.',uitspraak:'ah-mah-neh-THER',voorbeelden:[{es:'El amanecer fue precioso.',nl:'De dageraad was prachtig.'},{es:'Amaneció con niebla.',nl:'De dag brak aan met mist.'}]},
    {woord:'cómodo',woordsoort:'bijvoeglijk naamwoord',vertaling:'comfortabel / gemakkelijk',uitleg:'Cómodo is comfortabel — van een stoel, een situatie, een relatie. Sentirse cómodo con alguien is je op je gemak voelen bij iemand.',uitspraak:'CO-mo-do',voorbeelden:[{es:'Me siento cómoda contigo.',nl:'Ik voel me op mijn gemak bij jou.'},{es:'Una silla muy cómoda.',nl:'Een heel comfortabele stoel.'}]},
