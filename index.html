    {woord:'dulce',woordsoort:'bijvoeglijk naamwoord',vertaling:'zoet / teder / lief',uitleg:'Dulce is zoet — van smaak, maar ook van karakter, stem of herinnering. Un dulce recuerdo = een zoete herinnering. Dulce is nooit scherp.',uitspraak:'DOOL-theh',voorbeelden:[{es:'Tiene una voz muy dulce.',nl:'Ze heeft een heel tedere stem.'},{es:'Un sueño dulce.',nl:'Een zoete droom.'}]},
    {woord:'sosiego',woordsoort:'zelfstandig naamwoord (m)',vertaling:'kalmte / vrede / gemoedsrust',uitleg:'Sosiego is de kalmte van geest die je bereikt als alles stil is — van buiten en van binnen. Zeldzamer dan gewone rust, dieper dan gewone stilte.',uitspraak:'so-SYEH-go',voorbeelden:[{es:'Encontré el sosiego en la naturaleza.',nl:'Ik vond gemoedsrust in de natuur.'},{es:'Vive con sosiego.',nl:'Ze leeft in innerlijke vrede.'}]},
    {woord:'cadencioso',woordsoort:'bijvoeglijk naamwoord',vertaling:'ritmisch / cadensrijk',uitleg:'Beschrijft iets dat een aangenaam, regelmatig ritme heeft — muziek, een stem, de zee. Cadencioso klinkt al mooi terwijl je het zegt.',uitspraak:'kah-den-THYO-so',voorbeelden:[{es:'Un balanceo cadencioso.',nl:'Een ritmisch schommelen.'},{es:'Una voz cadenciosa y calmada.',nl:'Een ritmische, kalme stem.'}]},
  ],
  3: [ // Us two — verbondenheid, vertrouwen, vriendschap, samen
    {woord:'complicidad',woordsoort:'zelfstandig naamwoord (v)',vertaling:'verstandhouding / medeplichtigheid',uitleg:'Complicidad is de geheime taal tussen twee mensen die elkaar begrijpen zonder woorden. De beste soort verbinding.',uitspraak:'com-plee-thee-DAD',voorbeelden:[{es:'Entre ellos hay una complicidad especial.',nl:'Tussen hen is een bijzondere verstandhouding.'},{es:'Una mirada llena de complicidad.',nl:'Een blik vol gedeeld begrip.'}]},
    {woord:'cómplice',woordsoort:'zelfstandig naamwoord (m/v)',vertaling:'medeplichtige / bondgenoot',uitleg:'Je cómplice is degene die je avonturen deelt en je geheimen bewaart. In de warme zin van het woord — niet crimineel maar vertrouwd.',uitspraak:'COM-plee-theh',voorbeelden:[{es:'Eres mi cómplice en todo.',nl:'Jij bent mijn bondgenoot in alles.'},{es:'Una sonrisa cómplice.',nl:'Een wetende glimlach.'}]},
    {woord:'querencia',woordsoort:'zelfstandig naamwoord (v)',vertaling:'thuisgevoel / verlangen naar een plek',uitleg:'Querencia is de plek of persoon waar je je veilig voelt, waar je naartoe terugkeert. Je anker. Niet vertaalbaar in één woord.',uitspraak:'keh-REN-thya',voorbeelden:[{es:'Esta ciudad es mi querencia.',nl:'Deze stad is mijn thuisgevoel.'},{es:'Tú eres mi querencia.',nl:'Jij bent waar ik me thuis voel.'}]},
    {woord:'vínculo',woordsoort:'zelfstandig naamwoord (m)',vertaling:'band / verbinding / relatie',uitleg:'Een vínculo is de emotionele band tussen mensen — diep, soms onzichtbaar maar altijd voelbaar. Niet alle vínculos hebben een verklaring.',uitspraak:'VEEN-coo-lo',voorbeelden:[{es:'Tenemos un vínculo muy fuerte.',nl:'We hebben een heel sterke band.'},{es:'Un vínculo que dura toda la vida.',nl:'Een band die een leven lang duurt.'}]},
    {woord:'confianza',woordsoort:'zelfstandig naamwoord (v)',vertaling:'vertrouwen / openheid',uitleg:'Confianza is vertrouwen — maar ook de gemakkelijkheid die je voelt bij iemand die je volledig vertrouwt. Tener confianza met iemand betekent jezelf kunnen zijn.',uitspraak:'con-FYAN-tha',voorbeelden:[{es:'Tenemos mucha confianza.',nl:'We hebben veel vertrouwen in elkaar.'},{es:'Puedo hablar con total confianza.',nl:'Ik kan met complete openheid praten.'}]},
    {woord:'azar',woordsoort:'zelfstandig naamwoord (m)',vertaling:'toeval / lot',uitleg:'Azar is het mooie toeval dat mensen bij elkaar brengt. Niet geluk of pech — maar iets poëtischers dan dat.',uitspraak:'ah-THAR',voorbeelden:[{es:'El azar nos unió.',nl:'Het toeval bracht ons samen.'},{es:'Los caminos del azar son misteriosos.',nl:'De wegen van het toeval zijn mysterieus.'}]},
    {woord:'afecto',woordsoort:'zelfstandig naamwoord (m)',vertaling:'genegenheid / warmte / tederheid',uitleg:'Afecto is de genegenheid die je voelt voor mensen dicht bij je — niet de intense passie van liefde, maar de warme constante nabijheid.',uitspraak:'ah-FEK-to',voorbeelden:[{es:'Le tengo mucho afecto.',nl:'Ik heb veel genegenheid voor haar.'},{es:'Un gesto lleno de afecto.',nl:'Een gebaar vol tederheid.'}]},
    {woord:'cariño',woordsoort:'zelfstandig naamwoord (m)',vertaling:'genegenheid / liefde / schatje',uitleg:'Cariño is de dagelijkse tederheid — de soort liefde die je voelt voor vrienden, familie en geliefden tegelijk. Ook een troetelnaam.',uitspraak:'kah-REE-nyo',voorbeelden:[{es:'Te tengo mucho cariño.',nl:'Ik voel veel warmte voor jou.'},{es:'¡Ven aquí, cariño!',nl:'Kom hier, schatje!'}]},
    {woord:'sintonía',woordsoort:'zelfstandig naamwoord (v)',vertaling:'afstemming / op dezelfde golflengte zijn',uitleg:'Estar en sintonía con alguien is op dezelfde golflengte zitten — dezelfde humor, dezelfde stiltes begrijpen, hetzelfde voelen op hetzelfde moment.',uitspraak:'seen-to-NEE-ah',voorbeelden:[{es:'Estamos en total sintonía.',nl:'We zijn volledig op dezelfde golflengte.'},{es:'Hay una sintonía especial entre nosotros.',nl:'Er is een bijzondere afstemming tussen ons.'}]},
    {woord:'empatía',woordsoort:'zelfstandig naamwoord (v)',vertaling:'empathie / inlevingsvermogen',uitleg:'Empatía is het vermogen je in een ander in te voelen — hun vreugde jouw vreugde, hun pijn jouw pijn. De basis van echte verbinding.',uitspraak:'em-pah-TEE-ah',voorbeelden:[{es:'Tiene una empatía increíble.',nl:'Ze heeft een ongelooflijk inlevingsvermogen.'},{es:'La empatía nos une.',nl:'Empathie verbindt ons.'}]},
    {woord:'lealtad',woordsoort:'zelfstandig naamwoord (v)',vertaling:'loyaliteit / trouw',uitleg:'Lealtad is trouw in goede en slechte tijden. Niet blindelings, maar bewust — je kiest ervoor om te blijven.',uitspraak:'leh-al-TAD',voorbeelden:[{es:'Su lealtad nunca falla.',nl:'Haar loyaliteit wankelt nooit.'},{es:'La lealtad es la base de la amistad.',nl:'Loyaliteit is de basis van vriendschap.'}]},
    {woord:'amistad',woordsoort:'zelfstandig naamwoord (v)',vertaling:'vriendschap',uitleg:'Amistad is een van de meest gewaardeerde dingen in de Spaanse cultuur. Echte vriendschap is diep en trouw — la amistad verdadera es para siempre.',uitspraak:'ah-mees-TAD',voorbeelden:[{es:'La amistad es un tesoro.',nl:'Vriendschap is een schat.'},{es:'Nuestra amistad es para siempre.',nl:'Onze vriendschap is voor altijd.'}]},
    {woord:'compadreo',woordsoort:'zelfstandig naamwoord (m)',vertaling:'kameraadschap / vriendschapsbanden',uitleg:'Compadreo beschrijft de solidariteit en warmte tussen goede vrienden of mensen die door dezelfde ervaringen verbonden zijn.',uitspraak:'com-pah-DREH-o',voorbeelden:[{es:'Hay un buen compadreo en el grupo.',nl:'Er is een goede kameraadschap in de groep.'},{es:'El compadreo les unía.',nl:'De kameraadschap bond hen.'}]},
    {woord:'compartir',woordsoort:'werkwoord',vertaling:'delen / samen beleven',uitleg:'Compartir is meer dan iets doorgeven — het is samen iets beleven, er samen in staan. Compartir un momento vale más que mil palabras.',uitspraak:'com-par-TEER',voorbeelden:[{es:'Me alegra compartir esto contigo.',nl:'Ik ben blij dit met jou te delen.'},{es:'Compartir es vivir doble.',nl:'Delen is dubbel leven.'}]},
    {woord:'encuentro',woordsoort:'zelfstandig naamwoord (m)',vertaling:'ontmoeting / hereniging',uitleg:'Een encuentro is een ontmoeting die telt — niet toevallig maar betekenisvol. Twee mensen die elkaar vinden op het juiste moment.',uitspraak:'en-KWEN-tro',voorbeelden:[{es:'Fue un encuentro inesperado y bonito.',nl:'Het was een onverwachte en mooie ontmoeting.'},{es:'El encuentro me llenó de alegría.',nl:'De ontmoeting vervulde me met vreugde.'}]},
    {woord:'complicar',woordsoort:'werkwoord (als idioom)',vertaling:'het ingewikkeld maken (als compliment)',uitleg:'Hacerse complicados can be a good thing — complexe, gelaagde verbindingen zijn dieper dan simpele. Maar in goede zin.',uitspraak:'com-plee-KAR',voorbeelden:[{es:'Nos complicamos juntos.',nl:'We maken het samen ingewikkeld — op de beste manier.'},{es:'No todo tiene que ser fácil.',nl:'Niet alles hoeft makkelijk te zijn.'}]},
    {woord:'hermandad',woordsoort:'zelfstandig naamwoord (v)',vertaling:'broeder-/zusterschap / hechte verbinding',uitleg:'Hermandad is de band die sterker is dan vriendschap — als familie, maar gekozen. Niet bloed maar keuze.',uitspraak:'er-man-DAD',voorbeelden:[{es:'Existe una hermandad entre ellas.',nl:'Er bestaat een zusterschap tussen hen.'},{es:'La hermandad se forja en las dificultades.',nl:'Broederschap wordt gesmeed in moeilijke tijden.'}]},
    {woord:'entendimiento',woordsoort:'zelfstandig naamwoord (m)',vertaling:'begrip / verstandhouding / wederzijds verstaan',uitleg:'Entendimiento is het wederzijdse begrip tussen twee mensen — niet alleen intellectueel maar ook emotioneel. Als je elkaar écht begrijpt.',uitspraak:'en-ten-dee-MYEN-to',voorbeelden:[{es:'Hay un entendimiento perfecto entre ellos.',nl:'Er is een perfect wederzijds begrip tussen hen.'},{es:'El entendimiento hace fuerte la relación.',nl:'Begrip maakt de relatie sterk.'}]},
    {woord:'cobijo',woordsoort:'zelfstandig naamwoord (m)',vertaling:'beschutting / veiligheid / thuis',uitleg:'Cobijo is de beschutting die je geeft en ontvangt in een echte vriendschap of liefde — een veilige plek waar je jezelf kunt zijn.',uitspraak:'co-BEE-ho',voorbeelden:[{es:'Ella es mi cobijo.',nl:'Zij is mijn veilige haven.'},{es:'Encontré cobijo en su amistad.',nl:'Ik vond beschutting in haar vriendschap.'}]},
    {woord:'recuerdo',woordsoort:'zelfstandig naamwoord (m)',vertaling:'herinnering / souvenir',uitleg:'Recuerdo is een herinnering — maar ook een souvenir, iets dat je meeneemt van een plek of persoon. Guardar un buen recuerdo = een goede herinnering bewaren.',uitspraak:'reh-KWER-do',voorbeelden:[{es:'Guardo un recuerdo muy bonito de eso.',nl:'Ik bewaar een heel mooie herinnering daaraan.'},{es:'Los recuerdos compartidos nos unen.',nl:'Gedeelde herinneringen verbinden ons.'}]},
    {woord:'presente',woordsoort:'bijvoeglijk naamwoord / zelfstandig naamwoord',vertaling:'aanwezig / het huidige moment',uitleg:'Presente is aanwezig — in het moment, bij de ander. Estar presente is een cadeau: je bent er écht, niet afgeleid.',uitspraak:'preh-SEN-teh',voorbeelden:[{es:'Estar presente es un regalo.',nl:'Aanwezig zijn is een cadeau.'},{es:'Siempre está presente cuando la necesito.',nl:'Ze is er altijd als ik haar nodig heb.'}]},
    {woord:'alma gemela',woordsoort:'zelfstandig naamwoord (v)',vertaling:'zielsverwant',uitleg:'Alma gemela is een zielsverwant — iemand die lijkt alsof ze altijd in jouw leven had moeten zijn. Niet per se romantisch, ook vriendschappelijk.',uitspraak:'AL-mah heh-MEH-lah',voorbeelden:[{es:'Creo que es mi alma gemela.',nl:'Ik denk dat ze mijn zielsverwant is.'},{es:'Las almas gemelas se encuentran.',nl:'Zielsverwanten vinden elkaar.'}]},
    {woord:'incondicional',woordsoort:'bijvoeglijk naamwoord',vertaling:'onvoorwaardelijk',uitleg:'Amor incondicional of amistad incondicional is liefde of vriendschap zonder voorwaarden — je blijft, ongeacht wat er komt.',uitspraak:'een-con-dee-thyo-NAL',voorbeelden:[{es:'Su apoyo siempre es incondicional.',nl:'Haar steun is altijd onvoorwaardelijk.'},{es:'El amor incondicional es el más verdadero.',nl:'Onvoorwaardelijke liefde is de meest echte.'}]},
    {woord:'abrazo',woordsoort:'zelfstandig naamwoord (m)',vertaling:'omhelzing / knuffel',uitleg:'Een abrazo is meer dan een knuffel — in Spanje is het een hartelijke omhelzing die warmte, verbinding en aanwezigheid uitdrukt.',uitspraak:'ah-BRAH-tho',voorbeelden:[{es:'Te mando un abrazo enorme.',nl:'Ik stuur je een enorme omhelzing.'},{es:'Un abrazo vale más que mil palabras.',nl:'Een omhelzing zegt meer dan duizend woorden.'}]},
    {woord:'codo con codo',woordsoort:'idioom',vertaling:'schouder aan schouder / zij aan zij',uitleg:'Letterlijk "elleboog aan elleboog" — idioom voor samen iets doen, naast elkaar, als een team. Niet voor elkaar, maar mét elkaar.',uitspraak:'CO-do con CO-do',voorbeelden:[{es:'Trabajamos codo con codo.',nl:'We werken schouder aan schouder.'},{es:'Siempre a tu lado, codo con codo.',nl:'Altijd naast je, zij aan zij.'}]},
    {woord:'apoyo',woordsoort:'zelfstandig naamwoord (m)',vertaling:'steun / ondersteuning',uitleg:'Apoyo is de steun die je geeft als iemand het nodig heeft. Contar con alguien = op iemand kunnen rekenen. Apoyo is dat vertrouwen.',uitspraak:'ah-PO-yo',voorbeelden:[{es:'Gracias por tu apoyo incondicional.',nl:'Dank je voor je onvoorwaardelijke steun.'},{es:'Siempre puedo contar con su apoyo.',nl:'Ik kan altijd op haar steun rekenen.'}]},
    {woord:'compenetración',woordsoort:'zelfstandig naamwoord (v)',vertaling:'samenspel / perfecte afstemming',uitleg:'Compenetración is de perfecte afstemming tussen twee mensen — ze begrijpen elkaar zo goed dat ze als één geheel functioneren.',uitspraak:'com-peh-neh-trah-THYON',voorbeelden:[{es:'La compenetración entre ellas es perfecta.',nl:'De afstemming tussen hen is perfect.'},{es:'Tienen una gran compenetración.',nl:'Ze hebben een geweldige samenspel.'}]},
    {woord:'nexo',woordsoort:'zelfstandig naamwoord (m)',vertaling:'verbinding / schakel / band',uitleg:'Nexo is de schakel die twee dingen of mensen verbindt — een gemeenschappelijke ervaring, een geheime herinnering, een gedeelde waarde.',uitspraak:'NEK-so',voorbeelden:[{es:'Hay un nexo invisible entre nosotros.',nl:'Er is een onzichtbare band tussen ons.'},{es:'La música es nuestro nexo.',nl:'Muziek is onze verbindende schakel.'}]},
    {woord:'compaña',woordsoort:'zelfstandig naamwoord (v)',vertaling:'gezelschap / nabijheid',uitleg:'Compaña (verkorting van compañía) is het gezelschap van iemand die je dierbaar is. Soms is alleen de aanwezigheid van iemand al genoeg.',uitspraak:'com-PAN-ya',voorbeelden:[{es:'Me alegra tu compaña.',nl:'Je gezelschap maakt me blij.'},{es:'En buena compaña todo es mejor.',nl:'In goed gezelschap is alles beter.'}]},
    {woord:'acuerdo',woordsoort:'zelfstandig naamwoord (m)',vertaling:'overeenstemming / akkoord',uitleg:'De acuerdo = akkoord, het eens zijn. Maar acuerdo ook als "overeenstemming" — twee mensen die op dezelfde lijn zitten, het met elkaar eens zijn.',uitspraak:'ah-KWER-do',voorbeelden:[{es:'Estamos de acuerdo en todo.',nl:'We zijn het over alles eens.'},{es:'Llegaron a un acuerdo.',nl:'Ze kwamen tot overeenstemming.'}]},
    {woord:'consuelo',woordsoort:'zelfstandig naamwoord (m)',vertaling:'troost / bemoediging',uitleg:'Consuelo is de troost die je aan iemand geeft in moeilijke momenten. Ser el consuelo de alguien is er zijn als het telt.',uitspraak:'con-SWEH-lo',voorbeelden:[{es:'Tu presencia es mi mayor consuelo.',nl:'Jouw aanwezigheid is mijn grootste troost.'},{es:'Encontró consuelo en su amistad.',nl:'Ze vond troost in haar vriendschap.'}]},
    {woord:'compañía',woordsoort:'zelfstandig naamwoord (v)',vertaling:'gezelschap / bedrijf',uitleg:'Compañía is gezelschap in alle vormen. De beste compañía is de persoon bij wie je kunt zwijgen en toch niet alleen voelt.',uitspraak:'com-pan-YEE-ah',voorbeelden:[{es:'Me encanta tu compañía.',nl:'Ik hou van jouw gezelschap.'},{es:'En buena compañía el tiempo vuela.',nl:'In goed gezelschap vliegt de tijd.'}]},
    {woord:'latido',woordsoort:'zelfstandig naamwoord (m)',vertaling:'hartslag / klopping',uitleg:'Latido is een hartslag — maar ook de polsslag van een moment of een relatie. Sentir el latido de algo = de levende kracht ervan voelen.',uitspraak:'lah-TEE-do',voorbeelden:[{es:'Los latidos del corazón no mienten.',nl:'Hartslagen liegen niet.'},{es:'Siento el latido de nuestra amistad.',nl:'Ik voel de hartslag van onze vriendschap.'}]},
    {woord:'resiliencia',woordsoort:'zelfstandig naamwoord (v)',vertaling:'veerkracht / aanpassingsvermogen',uitleg:'Resiliencia is de kracht om te herstellen na moeilijke momenten. Samen hebben mensen meer resiliencia — gedeeld verdriet is halver.',uitspraak:'reh-see-LYEN-thya',voorbeelden:[{es:'Nuestra amistad tiene mucha resiliencia.',nl:'Onze vriendschap heeft veel veerkracht.'},{es:'La resiliencia se construye juntos.',nl:'Veerkracht bouw je samen op.'}]},
    {woord:'complicidad silenciosa',woordsoort:'uitdrukking',vertaling:'stille verstandhouding',uitleg:'De stille verstandhouding waarbij je niets hoeft te zeggen. Je kijkt elkaar aan en weet wat de ander denkt. De mooiste vorm van verbinding.',uitspraak:'com-plee-thee-DAD see-len-THY-o-sa',voorbeelden:[{es:'Había una complicidad silenciosa entre ellas.',nl:'Er was een stille verstandhouding tussen hen.'},{es:'Una mirada basta.',nl:'Één blik is genoeg.'}]},
    {woord:'recíproco',woordsoort:'bijvoeglijk naamwoord',vertaling:'wederzijds / wederkerig',uitleg:'Recíproco beschrijft iets dat van beide kanten komt — respect, liefde, vertrouwen. De beste relaties zijn recíprocas.',uitspraak:'reh-THEE-pro-co',voorbeelden:[{es:'El respeto debe ser recíproco.',nl:'Respect moet wederzijds zijn.'},{es:'Un cariño recíproco y genuino.',nl:'Een wederzijdse en echte genegenheid.'}]},
    {woord:'ternura',woordsoort:'zelfstandig naamwoord (v)',vertaling:'tederheid / zachtheid',uitleg:'Ternura is de tederheid die je voelt en toont naar iemand die je dierbaar is. Een blik, een gebaar, een stem — ternura zit in de details.',uitspraak:'ter-NOO-rah',voorbeelden:[{es:'Habla con una ternura especial.',nl:'Ze praat met een bijzondere tederheid.'},{es:'La ternura de su mirada me conmueve.',nl:'De tederheid van haar blik roert me.'}]},
    {woord:'unión',woordsoort:'zelfstandig naamwoord (v)',vertaling:'verbinding / eenheid / unie',uitleg:'Unión is de verbinding die twee mensen of groepen tot iets groters maakt. La unión hace la fuerza — samen staan we sterker.',uitspraak:'oo-NYON',voorbeelden:[{es:'La unión entre ellas es admirable.',nl:'De verbinding tussen hen is bewonderenswaardig.'},{es:'La unión hace la fuerza.',nl:'Eendracht maakt macht.'}]},
    {woord:'espontáneo',woordsoort:'bijvoeglijk naamwoord',vertaling:'spontaan / vanuit het hart',uitleg:'Espontáneo beschrijft dingen die vanuit het hart komen, zonder planning. De beste momenten zijn espontáneos.',uitspraak:'es-pon-TAH-neh-o',voorbeelden:[{es:'Un gesto espontáneo vale mucho.',nl:'Een spontaan gebaar is veel waard.'},{es:'Nos reímos de forma espontánea.',nl:'We lachen spontaan samen.'}]},
  ],
  4: [ // Su — bijzonderheid, authenticiteit, licht, warmte, moed
    {woord:'especial',woordsoort:'bijvoeglijk naamwoord',vertaling:'bijzonder / speciaal',uitleg:'Especial is bijzonder — maar in het Spaans heeft het meer gewicht. Ser especial betekent dat je opvalt niet door wat je doet maar door wie je bent.',uitspraak:'es-peh-THYAL',voorbeelden:[{es:'Eres una persona muy especial.',nl:'Je bent een heel bijzonder persoon.'},{es:'Este momento es especial.',nl:'Dit moment is speciaal.'}]},
    {woord:'auténtica',woordsoort:'bijvoeglijk naamwoord (v)',vertaling:'authentiek / echt',uitleg:'Het hoogste compliment in het Spaans — authentiek zijn betekent volledig, onverschrokken jezelf zijn. Zonder masker, zonder performance.',uitspraak:'ow-TEN-tee-kah',voorbeelden:[{es:'Es completamente auténtica.',nl:'Ze is volledig authentiek.'},{es:'La autenticidad es escasa.',nl:'Authenticiteit is zeldzaam.'}]},
    {woord:'luz',woordsoort:'zelfstandig naamwoord (v)',vertaling:'licht',uitleg:'Iemand luz noemen is zeggen dat ze helderheid en warmte brengen. Ze verlichten de kamer zonder het te proberen.',uitspraak:'LOOTH',voorbeelden:[{es:'Eres la luz de la habitación.',nl:'Je bent het licht van de kamer.'},{es:'Su sonrisa llena de luz.',nl:'Haar glimlach vol licht.'}]},
    {woord:'valiente',woordsoort:'bijvoeglijk naamwoord',vertaling:'dapper / moedig',uitleg:'Valiente is niet alleen fysiek dapper — het is ook eerlijk durven zijn, je kwetsbaar durven opstellen, opnieuw beginnen na een val.',uitspraak:'vah-LYEN-teh',voorbeelden:[{es:'Es una mujer muy valiente.',nl:'Ze is een heel dappere vrouw.'},{es:'Ser valiente es también decir la verdad.',nl:'Dapper zijn is ook de waarheid zeggen.'}]},
    {woord:'entrañable',woordsoort:'bijvoeglijk naamwoord',vertaling:'dierbaar / hartelijk / innemend',uitleg:'Entrañable is een van de mooiste Spaanse woorden — iemand die zo dierbaar is dat ze rechtstreeks tot je hart doordringen. Niet vertaalbaar in één woord.',uitspraak:'en-trahn-YAH-bleh',voorbeelden:[{es:'Es una persona entrañable.',nl:'Ze is zo\'n liefdevol en dierbaar mens.'},{es:'Un recuerdo entrañable.',nl:'Een dierbare herinnering.'}]},
    {woord:'sincera',woordsoort:'bijvoeglijk naamwoord (v)',vertaling:'oprecht / eerlijk',uitleg:'Iemand die sincera is meent precies wat ze zegt. Geen filter, geen performance — gewoon de waarheid, met mildheid.',uitspraak:'seen-THEH-rah',voorbeelden:[{es:'Es una amiga muy sincera.',nl:'Ze is een heel oprechte vriendin.'},{es:'Gracias por ser tan sincera.',nl:'Dank je voor je eerlijkheid.'}]},
    {woord:'genuina',woordsoort:'bijvoeglijk naamwoord (v)',vertaling:'authentiek / oprecht / echt',uitleg:'Genuina is iets een stap verder dan sincera — het is echt in de kern, niet aangeleerd of aangenomen. Ze is gewoon wie ze is, altijd.',uitspraak:'heh-NWEE-nah',voorbeelden:[{es:'Su alegría es genuina.',nl:'Haar blijdschap is oprecht.'},{es:'Es una persona genuina y honesta.',nl:'Ze is een authentieke en eerlijke persoon.'}]},
    {woord:'magnética',woordsoort:'bijvoeglijk naamwoord (v)',vertaling:'magnetisch / aantrekkelijk',uitleg:'Iemand met een magnetische aantrekkingskracht trekt anderen naar zich toe zonder het te proberen. Ze heeft iets dat je niet kunt negeren.',uitspraak:'mag-NEH-tee-kah',voorbeelden:[{es:'Tiene una personalidad magnética.',nl:'Ze heeft een magnetische persoonlijkheid.'},{es:'Su presencia es magnética.',nl:'Haar aanwezigheid is magnetisch.'}]},
    {woord:'singular',woordsoort:'bijvoeglijk naamwoord',vertaling:'uniek / bijzonder / uitzonderlijk',uitleg:'Singular betekent dat iemand een soort op zichzelf is — niet te vergelijken, niet te vervangen. Het hoogste compliment voor iemand die echt uniek is.',uitspraak:'seen-goo-LAR',voorbeelden:[{es:'Es una persona singular.',nl:'Ze is een uniek persoon.'},{es:'Un talento singular e irrepetible.',nl:'Een uniek en onherhaalbaar talent.'}]},
    {woord:'irrepetible',woordsoort:'bijvoeglijk naamwoord',vertaling:'eenmalig / niet te herhalen',uitleg:'Irrepetible is wat er maar één keer is — een moment, een dag, een persoon. Je kunt het niet kopiëren of opnieuw maken.',uitspraak:'ee-reh-peh-TEE-bleh',voorbeelden:[{es:'Eres irrepetible.',nl:'Jij bent eenmalig.'},{es:'Un momento irrepetible.',nl:'Een moment dat nooit herhaald kan worden.'}]},
    {woord:'luminosa',woordsoort:'bijvoeglijk naamwoord (v)',vertaling:'stralend / lichtend',uitleg:'Luminosa is iemand die licht uitstraalt — van binnen. Niet per se vrolijk altijd, maar altijd met een innerlijk licht.',uitspraak:'loo-mee-NO-sah',voorbeelden:[{es:'Tiene una sonrisa luminosa.',nl:'Ze heeft een stralende glimlach.'},{es:'Una mirada luminosa e inteligente.',nl:'Een stralende en intelligente blik.'}]},

// ── STATE ─────────────────────────────────────────────────────────────────────
let currentMoodIdx = 0;
let currentPage = 'music';
let currentWord = null;
let loadedWords = {}; // cache: moodIdx -> word object

function getStorage() { try { return JSON.parse(localStorage.getItem('su_vocab')||'[]'); } catch(e){ return []; } }
function saveStorage(d) { try { localStorage.setItem('su_vocab', JSON.stringify(d)); } catch(e){} }

// ── MOOD SWITCH ───────────────────────────────────────────────────────────────
function switchMood(idx) {
  currentPage = 'music';
  currentMoodIdx = idx;
  const m = MOODS[idx];

  document.querySelectorAll('.nav-tab').forEach(t=>t.classList.remove('active'));
  document.querySelector(`.nav-tab[data-mood="${idx}"]`).classList.add('active');
  document.getElementById('page-music').classList.add('active');
  document.getElementById('page-vocab').classList.remove('active');

  document.documentElement.style.setProperty('--glow', m.glow);
  document.documentElement.style.setProperty('--accent', m.accent);

  document.getElementById('moodDesc').textContent = m.desc;
  document.getElementById('vinylIcon').textContent = m.icon;
  document.getElementById('openFull').href = m.link;

  // auto-play embed on tab click
  const wrap = document.getElementById('embedWrap');
  const startTime = Math.floor(Math.random()*1800);
  wrap.innerHTML = '<iframe src="https://open.spotify.com/embed/playlist/'+m.playlist+'?utm_source=generator&theme=0&start_time='+startTime+'" height="152" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy" style="border-radius:12px;display:block;"></iframe>';
  wrap.classList.add('visible');
  document.getElementById('vinyl').classList.add('playing');

  // load word (cached or new)
  if (loadedWords[idx]) {
    renderWord(loadedWords[idx]);
  } else {
    loadWord(false);
  }
}

function switchPage(page) {
  currentPage = page;
  document.querySelectorAll('.nav-tab').forEach(t=>t.classList.remove('active'));
  document.querySelector(`.nav-tab[data-page="vocab"]`).classList.add('active');
  document.getElementById('page-music').classList.remove('active');
  document.getElementById('page-vocab').classList.add('active');
  document.documentElement.style.setProperty('--glow','#ffffff');
  document.documentElement.style.setProperty('--accent','rgba(255,255,255,0.3)');
  renderVocabPage();
}

// ── SPOTIFY ───────────────────────────────────────────────────────────────────
function playRandom() {
  const m = MOODS[currentMoodIdx];
  const wrap = document.getElementById('embedWrap');
  const startTime = Math.floor(Math.random()*1800);
  wrap.innerHTML = `<iframe
    src="https://open.spotify.com/embed/playlist/${m.playlist}?utm_source=generator&theme=0&start_time=${startTime}"
    height="152"
    allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
    loading="lazy"
    style="border-radius:12px;display:block;"
  ></iframe>`;
  wrap.classList.add('visible');
  document.getElementById('vinyl').classList.add('playing');
}

// ── WORD via CLAUDE API ───────────────────────────────────────────────────────
function loadWord(forceNew) {
  const idx = currentMoodIdx;

  if (!forceNew && loadedWords[idx]) { renderWord(loadedWords[idx]); return; }

  const btn = document.getElementById('refreshBtn');
  btn.classList.add('spinning');
  setTimeout(()=>btn.classList.remove('spinning'), 400);

  // Get shown words to avoid repeats this session
  const shown = new Set(Object.values(loadedWords).map(w=>w&&w.woord).filter(Boolean));
  const pool = WORDS[idx].filter(w => !shown.has(w.woord));
  const source = pool.length > 0 ? pool : WORDS[idx]; // reset if all shown
  const word = source[Math.floor(Math.random() * source.length)];
  loadedWords[idx] = word;
  renderWord(word);
}

// ── RENDER WORD ───────────────────────────────────────────────────────────────
function renderWord(word) {
  currentWord = word;
  const stored = getStorage();
  const saved = stored.find(w=>w.woord===word.woord && w.moodIdx===currentMoodIdx);
  const rating = saved ? saved.rating : null;

  const voorbeelden = (word.voorbeelden||[]).map(e=>`
    <div class="example-line"><em>${e.es}</em></div>
    <div class="example-line" style="margin-bottom:10px;margin-left:1rem;font-size:12px;color:var(--muted)">${e.nl}</div>
  `).join('');

  document.getElementById('wordContent').innerHTML = `
    <div class="word-tag">Woord van de dag · ${MOODS[currentMoodIdx].label}</div>
    <div class="word-es">${word.woord}</div>
    <div class="word-type">${word.woordsoort||''}</div>
    <div class="word-nl-trans">${word.vertaling}</div>
    <div class="pron-row">
      <span class="pron-text">/${word.uitspraak}/</span>
      <button class="speak-btn" onclick="speakWord('${word.woord.replace(/'/g,"\\'")}')">
        <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
        Beluister
      </button>
    </div>
    <div class="word-uitleg">${word.uitleg}</div>
    ${voorbeelden ? `<div class="examples-label">Voorbeelden</div>${voorbeelden}` : ''}
    <div class="rating-row">
      <button class="rate-btn ${rating==='love'?'active-love':''}" onclick="rateWord('love')">❤️<span>Geweldig</span></button>
      <button class="rate-btn ${rating==='ok'?'active-ok':''}" onclick="rateWord('ok')">👍<span>Goed</span></button>
      <button class="rate-btn ${rating==='nope'?'active-nope':''}" onclick="rateWord('nope')">👎<span>Niet voor mij</span></button>
    </div>
    <div class="saved-msg ${rating?'ok':''}" id="savedMsg">${rating?'Opgeslagen ✓':''}</div>
  `;
}

// ── SPEECH ────────────────────────────────────────────────────────────────────
function speakWord(word) {
  if (!window.speechSynthesis) { alert('Speech not supported in this browser'); return; }
  window.speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(word);
  utter.lang = 'es-ES';
  utter.rate = 0.85;
  utter.pitch = 1;

  // Try to pick a Spanish voice
  const voices = window.speechSynthesis.getVoices();
  const esVoice = voices.find(v=>v.lang.startsWith('es'));
  if (esVoice) utter.voice = esVoice;
  window.speechSynthesis.speak(utter);
}

// Voices load async on some browsers
window.speechSynthesis && window.speechSynthesis.addEventListener('voiceschanged', ()=>{});

// ── RATING ────────────────────────────────────────────────────────────────────
function rateWord(rating) {
  if (!currentWord) return;
  const stored = getStorage();
  const filtered = stored.filter(w=>!(w.woord===currentWord.woord && w.moodIdx===currentMoodIdx));
  filtered.push({ ...currentWord, moodIdx: currentMoodIdx, moodLabel: MOODS[currentMoodIdx].label, rating, savedAt: Date.now() });
  saveStorage(filtered);

  // re-render buttons
  document.querySelectorAll('.rate-btn').forEach(b=>b.className='rate-btn');
  const map = {love:'active-love',ok:'active-ok',nope:'active-nope'};
  const btns = document.querySelectorAll('.rate-btn');
  const labels = ['love','ok','nope'];
  btns.forEach((b,i)=>{ if(labels[i]===rating) b.classList.add(map[rating]); });

  const msg = document.getElementById('savedMsg');
  if (msg) { msg.textContent='Opgeslagen ✓'; msg.classList.add('ok'); }
}

// ── VOCAB PAGE ────────────────────────────────────────────────────────────────
let activeFolder = 'all';

function filterFolder(f) {
  activeFolder = f;
  document.querySelectorAll('.folder-tab').forEach(t=>t.classList.remove('active'));
  document.querySelector(`.folder-tab[data-f="${f}"]`).classList.add('active');
  renderVocabList();
}

function renderVocabPage() {
  const stored = getStorage();
  const counts = {all:stored.length,love:0,ok:0,nope:0};
  stored.forEach(w=>{ if(counts[w.rating]!==undefined) counts[w.rating]++; });
  ['all','love','ok','nope'].forEach(f=>{ const el=document.getElementById(`cnt-${f}`); if(el) el.textContent=counts[f]||''; });
  renderVocabList();
}

function renderVocabList() {
  const stored = getStorage();
  const list = document.getElementById('vocabList');
  const filtered = activeFolder==='all' ? stored : stored.filter(w=>w.rating===activeFolder);
  if (!filtered.length) {
    list.innerHTML=`<div class="empty-state"><div class="big">📖</div>Nog geen woorden hier.<br>Beoordeel woorden in de mood-tabs om ze hier te zien.</div>`;
    return;
  }
  filtered.sort((a,b)=>b.savedAt-a.savedAt);
  list.innerHTML = filtered.map((w,i)=>{
    const emoji = w.rating==='love'?'❤️':w.rating==='ok'?'👍':'👎';
    const vb = (w.voorbeelden||[]).map(e=>`<div class="example-line"><em>${e.es}</em></div><div class="example-line" style="font-size:12px;color:var(--muted);margin-left:1rem;margin-bottom:8px">${e.nl}</div>`).join('');
    return `<div class="vocab-item" onclick="toggleVI(${i})">
      <div class="vi-header"><span class="vi-word">${w.woord}</span><span class="vi-rating">${emoji}</span></div>
      <div class="vi-nl">${w.vertaling} · <span style="font-size:11px;opacity:0.5">${w.moodLabel||''}</span></div>
      <div class="vi-detail" id="vi-${i}">
        <div class="vi-uitleg">${w.uitleg||''}</div>
        <div class="vi-pron-row">
          <span class="vi-pron">/${w.uitspraak}/</span>
          <button class="speak-btn" onclick="event.stopPropagation();speakWord('${(w.woord||'').replace(/'/g,"\\'")}')">
            <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
            Beluister
          </button>
        </div>
        ${vb ? `<div class="examples-label" style="margin-top:0.5rem">Voorbeelden</div>${vb}` : ''}
      </div>
    </div>`;
  }).join('');
}

function toggleVI(i) { const d=document.getElementById(`vi-${i}`); if(d) d.classList.toggle('open'); }

// ── EXPORT / IMPORT ──────────────────────────────────────────────────────────
function exportWords() {
  const data = getStorage();
  if (!data.length) { alert('No words saved yet!'); return; }
  const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'su-words-backup.json';
  a.click();
  URL.revokeObjectURL(url);
}

function importWords(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const data = JSON.parse(e.target.result);
      if (!Array.isArray(data)) throw new Error();
      saveStorage(data);
      renderVocabPage();
      alert('Words loaded successfully!');
    } catch(err) {
      alert('Could not read the file. Make sure it is a valid backup.');
    }
  };
  reader.readAsText(file);
}

switchMood(0);
